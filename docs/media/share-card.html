<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Vane share image source</title>
<style>
@font-face { font-family:Pinyon; src:url('../fonts/pinyon-script.woff2') format('woff2'); font-weight:400; }
@font-face { font-family:Cormorant; src:url('../fonts/cormorant-garamond-latin.woff2') format('woff2'); font-weight:300 700; }
* { box-sizing:border-box; }
html,body { margin:0; width:1200px; height:630px; overflow:hidden; }
body { position:relative; isolation:isolate; background:#19151f; color:#f2e9fa; font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif; }
body::before { content:''; position:absolute; z-index:-1; inset:-24px; background-color:#493853; background-image:linear-gradient(135deg,#1c1623d9,#111017f0),url('sunlight.webp'); background-size:cover; background-position:center; background-blend-mode:multiply,luminosity; filter:blur(12px); }
h1 { position:absolute; z-index:0; left:52px; top:30px; margin:0; font:400 224px/1 Pinyon,Georgia,serif; letter-spacing:0; }
.description { position:absolute; left:64px; top:314px; width:330px; margin:0; font:500 54px/1.08 Cormorant,Georgia,serif; letter-spacing:-.02em; }
.note { position:absolute; left:66px; top:448px; margin:0; color:#c9bad5; font-size:19px; line-height:1.5; }
.product { position:absolute; z-index:1; left:432px; top:116px; width:736px; height:auto; filter:drop-shadow(0 20px 24px #09060c80); }
.identity { position:absolute; left:64px; bottom:42px; display:flex; align-items:center; gap:14px; font-size:22px; color:#e3d5ee; }
.identity img { width:48px; height:48px; }
</style>
</head>
<body>
<h1>Vane</h1>
<p class="description">A native<br>Mac browser.</p>
<p class="note">Free and open source.</p>
<img class="product" src="vane-varied-spaces-v1-1536.webp" alt="Vane showing NASA Mars with sidebar tabs and Spaces">
<div class="identity"><img src="../app-icon-128.webp" alt="">vane.so</div>
</body>
</html>
