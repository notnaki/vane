# Generate Vane.xcodeproj with `xcodegen` in this folder. The project file is not committed.
name: Vane
options:
  bundleIdPrefix: io.github.notnaki
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: T7X84HN3W3
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Vane:
    type: application
    platform: iOS
    sources:
      - Vane
      # The Mac app's own sync engine, compiled unchanged, so both apps speak the same format.
      - path: ../Sources/Vane/ICloudModel.swift
      - path: ../Sources/Vane/ICloudJournal.swift
      - path: ../Sources/Vane/ICloudTransport.swift
      - path: ../Sources/Vane/ICloudRemoval.swift
      - path: ../Sources/Vane/ICloudApplyContext.swift
      - path: ../AppIcons/AppIcon.icon
        buildPhase: resources
    entitlements:
      path: Vane/Vane.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.io.github.notnaki.vane]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
        keychain-access-groups: ["$(AppIdentifierPrefix)io.github.notnaki.vane.ios"]
    info:
      path: Vane/Info.plist
      properties:
        CFBundleDisplayName: Vane
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # Websites ask through WebKit; iOS shows these when a page requests access.
        NSCameraUsageDescription: A website you're visiting wants to use your camera.
        NSMicrophoneUsageDescription: A website you're visiting wants to use your microphone.
        NSLocationWhenInUseUsageDescription: A website you're visiting wants to know your location.
        NSPhotoLibraryAddUsageDescription: Vane saves images you choose to your photo library.
        NSFaceIDUsageDescription: Websites can use Face ID to sign you in with a passkey.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.notnaki.vane.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
