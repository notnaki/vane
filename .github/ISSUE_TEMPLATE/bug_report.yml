name: Bug report
description: Report a reproducible problem with Vane.
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before reporting a bug. For vulnerabilities, use
        [private reporting](https://github.com/notnaki/vane/security/advisories/new).
        Remove passwords, tokens, personal browsing data, and private documents
        from all examples, logs, and screenshots.
  - type: input
    id: vane-version
    attributes:
      label: Vane version and build
      description: Find this in Vane → About Vane. For source builds, include the commit.
      placeholder: Version, build number, or commit SHA
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: Include the full version from System Settings → General → About.
      placeholder: macOS version and build, if known
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - GitHub release
        - Built from source
        - Other / unsure
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include how often it happens and a public example URL if relevant.
      placeholder: |
        1. Open…
        2. Select…
        3. Observe…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happens instead? Include any error message.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: |
        Optional screenshots, redacted logs, or a recording. Mention relevant
        extensions, Boosts, profile/private-window behavior, or source-build
        toolchain and signing details. Only share information safe to make public.
