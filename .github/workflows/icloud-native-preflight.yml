name: iCloud integration native preflight
on:
  push:
    branches: [codex/icloud-native-preflight-20261111]
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      VANE_NATIVE_FIXTURE_PRIMARY_TIMEOUT: '1200'
      SWIFT_BACKTRACE: enable=yes,interactive=no,color=no,threads=crashed,registers=none,images=none,limit=48,top=0,sanitize=yes,output-to=stderr,timeout=10s,warnings=suppressed
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c3459fad860fa681e0a853dc534eff11ce27cb63
      - name: Download exact failed CI runtime
        uses: actions/download-artifact@v8
        with:
          name: debug-runtime
          run-id: 42984559023
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/vane-debug-runtime
      - name: Restore exact failed CI runtime without rebuilding
        run: |
          python3 scripts/ci-build-artifact.py restore --revision c3459fad860fa681e0a853dc534eff11ce27cb63 --archive "$RUNNER_TEMP/vane-debug-runtime/vane-debug-runtime.tar.gz"
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Enable and verify animated motion on the hosted desktop
        run: |
          defaults write com.apple.universalaccess reduceMotion -bool false
          swift -e 'import AppKit; let reduced = NSWorkspace.shared.accessibilityDisplayShouldReduceMotion; print("HOST_REDUCE_MOTION=\(reduced)"); exit(reduced ? 1 : 0)'
      - name: Three predetermined native attempts with retirement
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          selection = 'WindowResizeLayoutTests|SpaceNativeRenderingTests'
          statuses = []
          for attempt in range(1, 4):
              log = root / f'icloud-native-preflight-{attempt}.log'
              with log.open('w') as output:
                  result = subprocess.run(['python3','scripts/run-native-tests.py','--skip-build','--jobs','1','--filter',selection], stdout=output, stderr=subprocess.STDOUT)
              text = log.read_text()
              status = result.returncode
              if 'Native suite primary status=0; cleanup status=0' not in text or '*** Signal ' in text:
                  status = status or 1
              statuses.append(status)
              print(f'ATTEMPT {attempt}: status={status}', flush=True)
              print(text[-5000:], flush=True)
          print(f'ALL_ATTEMPTS {statuses}', flush=True)
          sys.exit(any(statuses))
          PYTHON
      - name: Preserve every attempt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: icloud-native-preflight
          path: ${{ runner.temp }}/icloud-native-preflight-*.log
