name: iCloud integration native preflight
on:
  push:
    branches: [codex/icloud-native-preflight-20261111]
permissions:
  contents: read
  actions: read
env:
  VANE_NATIVE_FIXTURE_PRIMARY_TIMEOUT: '1200'
  SWIFT_BACKTRACE: enable=yes,interactive=no,color=no,threads=crashed,registers=none,images=none,limit=48,top=0,sanitize=yes,output-to=stderr,timeout=10s,warnings=suppressed
jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: e889b23c46fe074e75ab85dd8dab4132bbd6eea5
      - name: Download exact diagnostic runtime
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 43008137901
          name: native-diagnostic-runtime
          path: ${{ runner.temp }}/native-diagnostic-runtime
      - name: Restore and verify diagnostic runtime
        run: python3 scripts/ci-build-artifact.py restore --revision e889b23c46fe074e75ab85dd8dab4132bbd6eea5 --archive "$RUNNER_TEMP/native-diagnostic-runtime/native-diagnostic-runtime.tar.gz"
      - name: Enable and verify animated motion on the hosted desktop
        run: |
          defaults write com.apple.universalaccess reduceMotion -bool false
          swift -e 'import AppKit; let reduced = NSWorkspace.shared.accessibilityDisplayShouldReduceMotion; print("HOST_REDUCE_MOTION=\(reduced)"); exit(reduced ? 1 : 0)'
      - name: Predetermined focused attempt with retirement
        env:
          ATTEMPT: '1'
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          runner = pathlib.Path('scripts/run-native-tests.py').read_text()
          injection = "    def collect_owned_profile():\n        root = Path(os.environ['RUNNER_TEMP'])\n        with (root / 'profile-sampler.log').open('w') as output:\n            deadline = time.monotonic() + 30\n            while time.monotonic() < deadline:\n                try:\n                    records = load_records(directory, token)\n                    for record in records:\n                        host = record['host']\n                        observed = process_identity(host['pid'])\n                        if observed is None or observed['start'] != host['start'] or observed['path'] != host['path']:\n                            continue\n                        output.write('VERIFIED_OWNED_TEST_HOST=' + json.dumps(host) + '\\n')\n                        output.flush()\n                        subprocess.run(['/usr/bin/sample', str(host['pid']), '30', '5', '-mayDie', '-file', str(root / 'profile-main-thread-sample.txt')], stdout=output, stderr=subprocess.STDOUT, timeout=75)\n                        return\n                except Exception as error:\n                    output.write('SAMPLER_ADMISSION=' + str(error) + '\\n')\n                    output.flush()\n                time.sleep(0.05)\n            output.write('NO_OWNED_LIVE_WEBKIT_HOST_ADMITTED\\n')\n    sampling_thread = threading.Thread(target=collect_owned_profile, daemon=True)\n    sampling_thread.start()\n"
          anchor = '    environment.pop(PHASE_ENV, None)\n'
          end = '        for signum, handler in previous.items(): signal.signal(signum, handler)'
          assert runner.count(anchor) == runner.count(end) == 1
          runner = runner.replace('import time\n','import time\nimport threading\n').replace(anchor,anchor+injection).replace(end,'        sampling_thread.join(timeout=80)\n'+end)
          script = root/'profile-owned-native-runner.py'
          script.write_text(runner)
          selection = 'WindowResizeLayoutTests.testClosingSidebarWithReducedMotionKeepsTheExpandingPagePainted|SpaceNativeRenderingTests.testCachedProfileChangesPageAtStartOfNativeLanding|SpaceNativeRenderingTests.testFirstProfileVisitChangesPageAtStartOfNativeLanding|SpaceNativeRenderingTests.testCachedProfileColourStaysContinuousAcrossRepeatedSwipes|SpaceNativeRenderingTests.testProfileOriginClickReversesBeforeTheCurrentLandingFinishes'
          log = root/'icloud-native-preflight-1.log'
          with log.open('w') as output:
              result = subprocess.run(['python3',str(script),'--skip-build','--jobs','1','--filter',selection],stdout=output,stderr=subprocess.STDOUT)
          sample = root/'profile-main-thread-sample.txt'
          graph = sample.read_text(errors='replace').split('Call graph:',1)[-1].split('Total number in stack',1)[0].strip() if sample.exists() else ''
          sampled = len(graph) > 50
          print(f'HOSTED_SAMPLER_VALID={sampled} GRAPH_BYTES={len(graph)}',flush=True)
          text = log.read_text()
          status = result.returncode or (0 if sampled else 1)
          if 'Native suite primary status=0; cleanup status=0' not in text or '*** Signal ' in text:
              status = status or 1
          print(text[-8000:],flush=True)
          sys.exit(status)
          PYTHON
      - name: Preserve attempt and pixel evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: icloud-native-profile-sample
          path: |
            ${{ runner.temp }}/icloud-native-preflight-*.log
            ${{ runner.temp }}/profile-main-thread-sample.txt
            ${{ runner.temp }}/profile-sampler.log
            /tmp/vane-resize-*.png
