name: iCloud integration native preflight
on:
  push:
    branches: [codex/icloud-native-preflight-20261111]
permissions:
  contents: read
  actions: read
env:
  VANE_NATIVE_FIXTURE_PRIMARY_TIMEOUT: '1200'
  SWIFT_BACKTRACE: enable=yes,interactive=no,color=no,threads=crashed,registers=none,images=none,limit=48,top=0,sanitize=yes,output-to=stderr,timeout=10s,warnings=suppressed
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Identify diagnostic cache toolchain
        id: toolchain
        run: echo "key=$(python3 scripts/ci-build-artifact.py toolchain)" >> "$GITHUB_OUTPUT"
      - name: Restore diagnostic debug build
        id: diagnostic-cache
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: native-diag-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**') }}
          restore-keys: |
            native-diag-${{ steps.toolchain.outputs.key }}-
            swift-debug-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - name: Restore unchanged source timestamps
        run: python3 scripts/ci-source-state.py restore
      - name: Build diagnostic runtime
        run: swift build -c debug --build-tests --disable-index-store
      - name: Preserve source timestamps for diagnostic debug cache
        run: python3 scripts/ci-source-state.py save
      - name: Save compiled diagnostic debug build before native assertions
        uses: actions/cache/save@v6
        with:
          path: .build
          key: ${{ steps.diagnostic-cache.outputs.cache-primary-key }}
      - name: Bundle compiled application
        env:
          VANE_CI_TOOLCHAIN_KEY: ${{ steps.toolchain.outputs.key }}
        run: ./make-app.sh debug --skip-app-build
      - name: Package exact diagnostic runtime
        run: |
          BIN_PATH=$(swift build -c debug --show-bin-path)
          python3 scripts/ci-build-artifact.py pack --bin-path "$BIN_PATH" --revision "$GITHUB_SHA" --archive "$RUNNER_TEMP/native-diagnostic-runtime.tar.gz"
      - name: Share compiled runtime
        uses: actions/upload-artifact@v6
        with:
          name: native-diagnostic-runtime
          path: ${{ runner.temp }}/native-diagnostic-runtime.tar.gz
          compression-level: 0
          retention-days: 7
  native:
    needs: build
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        attempt: [1]
    steps:
      - uses: actions/checkout@v7
      - name: Download exact diagnostic runtime
        uses: actions/download-artifact@v8
        with:
          digest-mismatch: warn
          name: native-diagnostic-runtime
          path: ${{ runner.temp }}/native-diagnostic-runtime
      - name: Restore and verify diagnostic runtime
        run: python3 scripts/ci-build-artifact.py restore --revision "$GITHUB_SHA" --archive "$RUNNER_TEMP/native-diagnostic-runtime/native-diagnostic-runtime.tar.gz"
      - name: Enable and verify animated motion on the hosted desktop
        run: |
          defaults write com.apple.universalaccess reduceMotion -bool false
          swift -e 'import AppKit; let reduced = NSWorkspace.shared.accessibilityDisplayShouldReduceMotion; print("HOST_REDUCE_MOTION=\(reduced)"); exit(reduced ? 1 : 0)'
      - name: Predetermined focused attempt with retirement
        env:
          ATTEMPT: ${{ matrix.attempt }}
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          attempt = os.environ['ATTEMPT']
          selection = 'WindowResizeLayoutTests.testClosingSidebarWithReducedMotionKeepsTheExpandingPagePainted|SpaceNativeRenderingTests.testCachedProfileChangesPageAtStartOfNativeLanding|SpaceNativeRenderingTests.testFirstProfileVisitChangesPageAtStartOfNativeLanding|SpaceNativeRenderingTests.testCachedProfileColourStaysContinuousAcrossRepeatedSwipes|SpaceNativeRenderingTests.testProfileOriginClickReversesBeforeTheCurrentLandingFinishes'
          log = root / f'icloud-native-preflight-{attempt}.log'
          with log.open('w') as output:
              result = subprocess.run(['python3','scripts/run-native-tests.py','--skip-build','--jobs','1','--filter',selection], stdout=output, stderr=subprocess.STDOUT)
          text = log.read_text()
          status = result.returncode
          if 'Native suite primary status=0; cleanup status=0' not in text or '*** Signal ' in text:
              status = status or 1
          print(f'ATTEMPT {attempt}: status={status}', flush=True)
          print(text[-6000:], flush=True)
          sys.exit(status)
          PYTHON
      - name: Preserve attempt and pixel evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: icloud-native-preflight-${{ matrix.attempt }}
          path: |
            ${{ runner.temp }}/icloud-native-preflight-*.log
            /tmp/vane-resize-*.png
