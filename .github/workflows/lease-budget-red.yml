name: lease budget red reproduction

on:
  pull_request:
    paths:
      - Tests/VaneTests/ExtensionCodeStoreTests.swift
      - .github/workflows/lease-budget-red.yml

permissions:
  contents: read

concurrency:
  group: lease-budget-red-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lease-budget:
    name: Lease budget controlled RED
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Build controlled native fixtures separately from their runtime budget
        run: swift build -c debug --build-tests --jobs 1
      - name: Controlled real-child cases against old readiness semantics
        env:
          VANE_NATIVE_FIXTURE_PRIMARY_TIMEOUT: '120'
        run: |
          set -o pipefail
          python3 scripts/run-native-tests.py --skip-build --jobs 1 --filter '^VaneTests[.]ExtensionCodeStoreTests/testLeaseHolder' 2>&1 | tee "$RUNNER_TEMP/vane-lease-budget-red.log"
      - name: Preserve controlled RED evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: lease-budget-red-${{ github.run_id }}
          path: ${{ runner.temp }}/vane-lease-budget-red.log
          if-no-files-found: warn
          retention-days: 7

