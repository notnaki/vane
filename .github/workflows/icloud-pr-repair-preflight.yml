name: iCloud PR repair preflight
on:
  push:
    branches: [codex/icloud-pr-repair-20261112]
permissions:
  contents: read
  actions: read
env:
  VANE_NATIVE_FIXTURE_PRIMARY_TIMEOUT: '600'
  SWIFT_BACKTRACE: enable=yes,interactive=no,color=no,threads=crashed,registers=none,images=none,limit=48,top=0,sanitize=yes,output-to=stderr,timeout=10s,warnings=suppressed
jobs:
  focused:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Identify diagnostic cache toolchain
        id: toolchain
        run: echo "key=$(python3 scripts/ci-build-artifact.py toolchain)" >> "$GITHUB_OUTPUT"
      - name: Restore diagnostic debug build
        id: diagnostic-cache
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: native-diag-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**') }}
          restore-keys: |
            native-diag-${{ steps.toolchain.outputs.key }}-
            swift-debug-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - name: Restore unchanged source timestamps
        run: python3 scripts/ci-source-state.py restore
      - name: Build diagnostic runtime
        run: swift build -c debug --build-tests --disable-index-store
      - name: Preserve source timestamps for diagnostic debug cache
        run: python3 scripts/ci-source-state.py save
      - name: Save compiled diagnostic debug build before native assertions
        uses: actions/cache/save@v6
        with:
          path: .build
          key: ${{ steps.diagnostic-cache.outputs.cache-primary-key }}
      - name: Bundle compiled application
        env:
          VANE_CI_TOOLCHAIN_KEY: ${{ steps.toolchain.outputs.key }}
        run: ./make-app.sh debug --skip-app-build
      - name: Enable and verify animated motion on the hosted desktop
        run: |
          defaults write com.apple.universalaccess reduceMotion -bool false
          swift -e 'import AppKit; let reduced = NSWorkspace.shared.accessibilityDisplayShouldReduceMotion; print("HOST_REDUCE_MOTION=\(reduced)"); exit(reduced ? 1 : 0)'
      - name: Three focused attempts with retirement
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          selection = 'ICloud|PasswordShadowAutofillTests|BoundedSidebarMountingTests|KeyboardAccessibilityTests|WindowResizeLayoutTests|WindowResizePreparationTests|NewTabDisclosureTests|PasswordAutofillTests.testSelectedAccountCannotContinueIntoDifferentHiddenOrReadOnlyIdentity|PasswordAutofillTests.testSubmittedMainUsernameAwaitsProcessedDenialBeforeNavigation|SpaceNativeRenderingTests.testCachedProfileChangesPageAtStartOfNativeLanding|SpaceNativeRenderingTests.testFirstProfileVisitChangesPageAtStartOfNativeLanding|SpaceNativeRenderingTests.testSlowNativeSpaceLandingNeverReversesItsPresentation|SpaceNativeRenderingTests.testNativeSpaceClickBlendsBackgroundDuringSidebarTravel|SpaceNativeRenderingTests.testProfileClickDoesNotRestoreItsDepartureColour|SpaceNativeRenderingTests.testProfileSwipeDoesNotRestoreItsDepartureColour|SpaceNativeRenderingTests.testReverseProfileSwipeTakesOverTheSamePresentedNativeRows|SpaceNativeRenderingTests.testRealSwipePresentedColourFollowsNativeLandingPosition'
          failed = False
          for attempt in range(1, 4):
              log = root / f'icloud-pr-repair-{attempt}.log'
              with log.open('w') as output:
                  result = subprocess.run(['python3','scripts/run-native-tests.py','--skip-build','--jobs','1','--filter',selection],stdout=output,stderr=subprocess.STDOUT)
              text = log.read_text()
              print(text, flush=True)
              passed = result.returncode == 0 and 'Native suite primary status=0; cleanup status=0' in text and '*** Signal ' not in text
              print(f'ATTEMPT {attempt}: passed={passed}', flush=True)
              failed |= not passed
          sys.exit(failed)
          PYTHON
      - name: Preserve every attempt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: icloud-pr-repair-preflight
          path: ${{ runner.temp }}/icloud-pr-repair-*.log
