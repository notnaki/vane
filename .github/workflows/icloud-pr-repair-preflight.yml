name: iCloud PR repair preflight
on:
  push:
    branches: [codex/icloud-pr-repair-20261112]
permissions:
  contents: read
  actions: read
env:
  VANE_NATIVE_FIXTURE_PRIMARY_TIMEOUT: '600'
  SWIFT_BACKTRACE: enable=yes,interactive=no,color=no,threads=crashed,registers=none,images=none,limit=48,top=0,sanitize=yes,output-to=stderr,timeout=10s,warnings=suppressed
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Identify diagnostic cache toolchain
        id: toolchain
        run: echo "key=$(python3 scripts/ci-build-artifact.py toolchain)" >> "$GITHUB_OUTPUT"
      - name: Restore diagnostic debug build
        id: diagnostic-cache
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: native-diag-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**') }}
          restore-keys: |
            native-diag-${{ steps.toolchain.outputs.key }}-a0d7c96b7e999c71a1ed8be602c27d3ab11986dcabd829f353eb38067d417997
            native-diag-${{ steps.toolchain.outputs.key }}-
            swift-debug-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - name: Restore unchanged source timestamps
        run: python3 scripts/ci-source-state.py restore
      - name: Build diagnostic runtime
        run: swift build -c debug --build-tests --disable-index-store
      - name: Preserve source timestamps for diagnostic debug cache
        run: python3 scripts/ci-source-state.py save
      - name: Save compiled diagnostic debug build before native assertions
        uses: actions/cache/save@v6
        with:
          path: .build
          key: ${{ steps.diagnostic-cache.outputs.cache-primary-key }}
      - name: Bundle compiled application
        env:
          VANE_CI_TOOLCHAIN_KEY: ${{ steps.toolchain.outputs.key }}
        run: ./make-app.sh debug --skip-app-build
      - name: Package verified native runtime
        run: |
          set -euo pipefail
          BIN_PATH=$(swift build -c debug --show-bin-path)
          python3 scripts/ci-build-artifact.py pack --bin-path "$BIN_PATH" --revision "$GITHUB_SHA" --archive "$RUNNER_TEMP/icloud-runtime.tar.gz"
      - name: Share runtime
        uses: actions/upload-artifact@v6
        with:
          name: icloud-repair-runtime
          path: ${{ runner.temp }}/icloud-runtime.tar.gz
          compression-level: 0
          retention-days: 1

  native:
    name: ${{ matrix.suite }} (${{ matrix.attempt }})
    needs: build
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
        suite: [native]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          digest-mismatch: warn
          name: icloud-repair-runtime
          path: ${{ runner.temp }}/runtime
      - name: Restore revision and toolchain verified runtime
        run: python3 scripts/ci-build-artifact.py restore --revision "$GITHUB_SHA" --archive "$RUNNER_TEMP/runtime/icloud-runtime.tar.gz"
      - name: Enable and verify animated motion
        run: |
          defaults write com.apple.universalaccess reduceMotion -bool false
          swift -e 'import AppKit; let reduced = NSWorkspace.shared.accessibilityDisplayShouldReduceMotion; print("HOST_REDUCE_MOTION=\(reduced)"); exit(reduced ? 1 : 0)'
      - name: Admit owned AppKit loop and verify retirement
        env:
          VANE_APPKIT_LOOP_SMOKE: '1'
          VANE_NATIVE_FIXTURE_PRIMARY_TIMEOUT: '90'
        run: |
          set -euo pipefail
          python3 scripts/run-native-tests.py --skip-build --jobs 1 --filter '^VaneTests[.]NativeApplicationLoopSmokeTests/testOwnedLoopAdmitsAsyncWorkAndStops$' 2>&1 | tee "$RUNNER_TEMP/icloud-smoke.log"
          python3 - <<'PYTHON'
          import os, pathlib
          text = (pathlib.Path(os.environ['RUNNER_TEMP'])/'icloud-smoke.log').read_text()
          assert 'Native suite primary status=0; cleanup status=0' in text
          assert 'AppKit loop smoke: delayedHeartbeat=true, completed=true' in text
          assert '*** Signal ' not in text
          PYTHON
      - name: Focused native attempt with retirement
        env:
          ATTEMPT: ${{ matrix.attempt }}
          SUITE: ${{ matrix.suite }}
        run: |
          python3 -u - <<'PYTHON'
          import os, pathlib, subprocess, sys
          selection = 'FolderRolloutTests|NestedFolderDisclosureTests|LargeFolderDisclosureTests|SidebarDisclosure|NewTabDisclosureTests|SpaceSwipePaletteTests|SpaceNativeRenderingTests.*(CommittedNativeLandingRetainsFingerVelocity|NativeLandingKeepsEventVelocityAcrossDelayedDelivery|NativeLandingDiscardsVelocityAfterAnEventTimeHold|ArmedNativeLandingKeepsReleaseVelocityAcrossPagePreparation)'
          log = pathlib.Path(os.environ['RUNNER_TEMP']) / ('icloud-pr-repair-' + os.environ['ATTEMPT'] + '.log')
          with log.open('w') as output:
              process = subprocess.Popen(['python3','-u','scripts/run-native-tests.py','--skip-build','--jobs','1','--filter',selection], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              for line in process.stdout:
                  output.write(line); output.flush()
                  print(line, end='', flush=True)
              status = process.wait()
          text = log.read_text()
          passed = status == 0 and 'Native suite primary status=0; cleanup status=0' in text and '*** Signal ' not in text
          print('ATTEMPT ' + os.environ['ATTEMPT'] + ': passed=' + str(passed), flush=True)
          sys.exit(0 if passed else (status or 1))
          PYTHON
      - name: Preserve every attempt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: icloud-repair-${{ matrix.suite }}-attempt-${{ matrix.attempt }}
          path: |
            ${{ runner.temp }}/icloud-pr-repair-*.log
            ${{ runner.temp }}/icloud-smoke.log
            /tmp/vane-resize-*.png
