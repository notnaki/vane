name: public-extension-ua-reduction

on:
  pull_request:
    paths:
      - Tests/Diagnostics/PublicWorkerUA/**
      - scripts/check-public-extension-ua.py
      - scripts/test-public-extension-ua.py
      - scripts/update-ci-safari27.py
      - scripts/test-update-ci-safari27.py
      - scripts/check-staged-webkit-evidence.py
      - scripts/test-staged-webkit-evidence.py
      - .github/workflows/public-extension-ua.yml
  workflow_dispatch:
    inputs:
      runtime:
        description: System WebKit runtime for this comparison
        type: choice
        default: macos-26
        options: [macos-26, macos-26-safari27, xcode-27]
      scenario:
        description: Ordered reproduction, fresh MV3, or MV3 reuse without prior MV2
        type: choice
        default: ordered
        options: [ordered, fresh-mv3, mv3-chain]

permissions:
  contents: read

concurrency:
  group: public-extension-ua-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-reduction:
    name: Public-only signed worker UA reduction (${{ inputs.runtime || 'macos-26' }}, ${{ inputs.scenario || 'ordered' }})
    runs-on: ${{ inputs.runtime == 'xcode-27' && 'xcode-27' || 'macos-26' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install only Apple's Safari 27 update on disposable macOS 26
        if: ${{ inputs.runtime == 'macos-26-safari27' }}
        timeout-minutes: 14
        run: |
          set -euo pipefail
          python3 -B scripts/test-update-ci-safari27.py
          python3 -B scripts/test-staged-webkit-evidence.py
          python3 -B scripts/update-ci-safari27.py 2>&1 | tee "$RUNNER_TEMP/safari27-update.log"

      - name: Verify immutable reduction inputs and reused process-control source
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/check-extension-ua.py)" = f83e267a36c9016e3bc8aeed5797bbf044e07ed1
          test "$(git hash-object scripts/run-native-tests.py)" = d9129128574ec0bedaeb1094d20addae1ed85c57
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('Tests/Diagnostics/PublicWorkerUA')
          manifest = root / 'SHA256.json'
          assert hashlib.sha256(manifest.read_bytes()).hexdigest() == '2b1419fc9b86f9d3b6c22e96dcb9dfcfc34323e4adfe88019c028b2a33bea9ae'
          inputs = json.loads(manifest.read_text())
          assert len(inputs) == 14 and not manifest.is_symlink()
          actual = {str(path.relative_to(root)) for path in root.rglob('*') if path.is_file() or path.is_symlink()}
          assert actual == set(inputs) | {'SHA256.json'}, 'Unexpected or missing reduction input'
          for name, expected in inputs.items():
              path = root / name
              assert path.is_file() and not path.is_symlink(), name
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected, name
          print('Exact 14 original public-only reduction inputs verified')
          PY
          git rev-parse HEAD
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          probe_sdk=$(xcrun --sdk macosx --show-sdk-version)
          case "$probe_sdk" in 26|26.*|27|27.*) ;; *) echo "Unsupported SDK for this reduction: $probe_sdk"; exit 1 ;; esac
          printf 'Public reduction SDK=%s; deployment floor=26.0\n' "$probe_sdk"
          sw_vers
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' /System/Library/Frameworks/WebKit.framework/Resources/Info.plist

      - name: Public evidence protocol pure guards
        run: python3 -B scripts/test-public-extension-ua.py

      - name: Compile and ad-hoc sandbox-sign original public probe
        id: probe
        timeout-minutes: 4
        env:
          VANE_TEST_STAGED_WEBKIT: ${{ inputs.runtime == 'macos-26-safari27' && '1' || '0' }}
        run: |
          set -euo pipefail
          SIGNING_IDENTITY=- bash Tests/Diagnostics/PublicWorkerUA/build.sh > "$RUNNER_TEMP/public-probe-build.stdout" 2> "$RUNNER_TEMP/public-probe-build.stderr"
          probe_bundle=$(tail -n 1 "$RUNNER_TEMP/public-probe-build.stdout")
          test -d "$probe_bundle"
          codesign --verify --strict --verbose=2 "$probe_bundle"
          codesign -d --entitlements :- "$probe_bundle" 2>&1 | tee "$RUNNER_TEMP/public-probe-entitlements.log"
          shasum -a 256 "$probe_bundle/Contents/MacOS/WorkerUAProbe" | tee "$RUNNER_TEMP/public-probe-binary.sha256"
          printf 'bundle=%s\n' "$probe_bundle" >> "$GITHUB_OUTPUT"

      - name: Eight fresh normal-app launches, stop at first failed sample
        timeout-minutes: 14
        env:
          PUBLIC_PROBE_BUNDLE: ${{ steps.probe.outputs.bundle }}
          PUBLIC_PROBE_SCENARIO: ${{ inputs.scenario || 'ordered' }}
        run: |
          set -euo pipefail
          python3 -B scripts/check-public-extension-ua.py --bundle "$PUBLIC_PROBE_BUNDLE" --scenario "$PUBLIC_PROBE_SCENARIO" --evidence-dir "$RUNNER_TEMP/public-probe-logs" 2>&1 | tee "$RUNNER_TEMP/public-probe-run.log"

      - name: Attest app-process runtime and staged image UUIDs (worker images unverified)
        if: ${{ inputs.runtime == 'macos-26-safari27' }}
        run: python3 -B scripts/check-staged-webkit-evidence.py "$RUNNER_TEMP/public-probe-logs"

      - name: Preserve complete capped logs and scoped public evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: public-worker-ua-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/safari27-update.log
            ${{ runner.temp }}/public-probe-build.stdout
            ${{ runner.temp }}/public-probe-build.stderr
            ${{ runner.temp }}/public-probe-entitlements.log
            ${{ runner.temp }}/public-probe-binary.sha256
            ${{ runner.temp }}/public-probe-run.log
            ${{ runner.temp }}/public-probe-logs/
          if-no-files-found: warn
          retention-days: 14
