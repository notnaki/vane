name: checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Temporary diagnostic run for #587. Restore the full workflow before merge.
jobs:
  checks:
    name: checks
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Restore debug build cache
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: cookie-preflight-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            swift-debug-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore content-matching source timestamps
        run: python3 scripts/ci-source-state.py restore
      - name: Build current app and tests
        run: swift build --build-system native -c debug --build-tests
      - name: Owned AppKit loop preflight
        env:
          VANE_APPKIT_LOOP_SMOKE: '1'
          VANE_NATIVE_FIXTURE_PRIMARY_TIMEOUT: '90'
        run: |
          set -euo pipefail
          python3 scripts/run-native-tests.py --build-system native --skip-build --jobs 1 --filter '^VaneTests[.]NativeApplicationLoopSmokeTests/testOwnedLoopAdmitsAsyncWorkAndStops$' 2>&1 | tee "$RUNNER_TEMP/cookie-loop-preflight.log"
          grep -Fq "Test Case '-[VaneTests.NativeApplicationLoopSmokeTests testOwnedLoopAdmitsAsyncWorkAndStops]' passed" "$RUNNER_TEMP/cookie-loop-preflight.log"
          grep -Fq 'AppKit loop smoke: delayedHeartbeat=true, completed=true' "$RUNNER_TEMP/cookie-loop-preflight.log"
          grep -Fq 'Native suite primary status=0; cleanup status=0' "$RUNNER_TEMP/cookie-loop-preflight.log"
      - name: Three focused attempts with original assertions and cleanup
        timeout-minutes: 15
        env:
          VANE_NATIVE_FIXTURE_PRIMARY_TIMEOUT: '240'
          SWIFT_BACKTRACE: enable=yes,interactive=no,color=no,threads=crashed,registers=none,images=none,limit=48,top=0,sanitize=yes,output-to=stderr,timeout=10s,warnings=suppressed
        run: |
          set -uo pipefail
          result=0
          for attempt in 1 2 3; do
            log="$RUNNER_TEMP/cookie-focused-$attempt.log"
            if ! python3 scripts/run-native-tests.py --build-system native --skip-build --jobs 1 --filter 'Feel04CookieRendererTests|Feel04AccountProofTests|Feel04RetryProofTests|PageDialogClippingTests|PageDialogsTests' 2>&1 | tee "$log"; then result=1; fi
            if ! grep -Fq 'Executed 22 tests, with 0 failures' "$log"; then result=1; fi
            if ! grep -Fq 'Native suite primary status=0; cleanup status=0' "$log"; then result=1; fi
            if grep -Eq '^\*\*\* Signal [0-9]+: Backtracing' "$log"; then result=1; fi
          done
          exit "$result"
      - name: Preserve every preflight attempt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pr587-cookie-preflight-logs
          path: |
            ${{ runner.temp }}/cookie-loop-preflight.log
            ${{ runner.temp }}/cookie-focused-*.log
          retention-days: 7
