name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer commit makes the older checks for this branch/PR redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # macOS 26 / Xcode 26: Package.swift targets .macOS("26.0"), and the WebKit APIs this
    # browser is built on (WKWebExtension, isInspectable) do not exist on older images.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Identify Swift toolchain
        id: toolchain
        run: |
          set -euo pipefail
          KEY=$({ swift --version; xcodebuild -version; xcrun --show-sdk-path; xcrun --show-sdk-build-version; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      # Only checks builds go into this cache. Release builds compile an OAuth secret
      # into the app, so their build products must never enter a PR-readable cache.
      # PRs reuse main's cache without leaving a separate archive for every revision.
      - name: Restore Swift debug build
        id: swift-cache
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: swift-debug-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ hashFiles('Sources/**/*.swift') }}
          restore-keys: |
            swift-debug-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-

      # Checkout gives even unchanged inputs new mtimes. Restore only content-matching
      # timestamps so Swift can reuse their object files without hiding source changes.
      - name: Restore unchanged source timestamps
        run: python3 scripts/ci-source-state.py restore

      - name: Source timestamp cache fixture
        run: python3 scripts/test-ci-source-state.py

      - name: Website scene regressions
        run: node docs/tests/galaxy.test.cjs

      # Debug avoids whole-module release optimization on every PR. Always ask SwiftPM
      # to build, even on an exact cache hit, so it validates the restored outputs.
      # The release workflow still builds and smoke-tests the optimized, signed app.
      - name: Build
        run: swift build -c debug

      # --pure stops before the keychain and WebKit assertions, which need a real signed
      # bundle and a window server respectively. Those stay a local `vane selfcheck`.
      - name: Checks
        run: ./.build/debug/vane selfcheck --pure

      - name: Cold WebKit registry startup
        run: scripts/check-webkit-startup.sh

      - name: App icon migration and bundled selections
        run: scripts/check-app-icons.sh

      - name: Native fixture runner safety
        run: python3 scripts/test-native-fixture-runner.py

      - name: Native regression tests
        id: native_tests
        env:
          # Capture the original process/order, even when no ReportCrash file appears.
          SWIFT_BACKTRACE: enable=yes,interactive=no,color=no,threads=crashed,registers=none,images=none,limit=48,top=0,sanitize=yes,output-to=stderr,timeout=10s,warnings=suppressed
        run: |
          set -o pipefail
          python3 scripts/run-native-tests.py 2>&1 | tee "$RUNNER_TEMP/vane-swift-tests.log"
          # Swift's signal handler can return after a software-raised trap. A fatal
          # signal remains a failed test run even if the process then exits zero.
          if grep -Eq '^\*\*\* Signal [0-9]+: Backtracing' "$RUNNER_TEMP/vane-swift-tests.log"; then
            echo '::error::Swift runtime captured a fatal signal during tests.'
            exit 1
          fi

      # Diagnostic-only follow-up: the unchanged full suite runs first. A failed
      # primary step stays failed; each fresh host also verifies its real case,
      # fatal-signal guard and post-exit retirement rather than accepting zero tests.
      - name: Fresh worker UA public-callback control
        if: ${{ always() && !cancelled() && (steps.native_tests.outcome == 'success' || steps.native_tests.outcome == 'failure') }}
        timeout-minutes: 4
        env:
          VANE_WEBKIT_UA_POLICY_PROBE_ARM: control
          SWIFT_BACKTRACE: enable=yes,interactive=no,color=no,threads=crashed,registers=none,images=none,limit=48,top=0,sanitize=yes,output-to=stderr,timeout=10s,warnings=suppressed
        run: |
          set +e
          python3 scripts/run-native-tests.py --skip-build --jobs 1 --filter '^VaneTests.WebKitExtensionUserAgentPolicyProbeTests/testFullUserAgentPolicyAgainstPublicBackgroundCallbackControl$' 2>&1 | tee "$RUNNER_TEMP/vane-ua-policy-control.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          if (( statuses[0] != 0 || statuses[1] != 0 )); then exit 1; fi
          if grep -Eq '^\*\*\* Signal [0-9]+: Backtracing' "$RUNNER_TEMP/vane-ua-policy-control.log"; then exit 1; fi
          grep -Fq "Test Case '-[VaneTests.WebKitExtensionUserAgentPolicyProbeTests testFullUserAgentPolicyAgainstPublicBackgroundCallbackControl]' passed" "$RUNNER_TEMP/vane-ua-policy-control.log" || { echo '::error::Expected worker control case did not pass.'; exit 1; }
          grep -Fq 'Native suite primary status=0; cleanup status=0' "$RUNNER_TEMP/vane-ua-policy-control.log" || { echo '::error::Worker control cleanup was not verified.'; exit 1; }

      - name: Fresh worker UA full-page-policy comparison
        if: ${{ always() && !cancelled() && (steps.native_tests.outcome == 'success' || steps.native_tests.outcome == 'failure') }}
        timeout-minutes: 4
        env:
          VANE_WEBKIT_UA_POLICY_PROBE_ARM: policy
          SWIFT_BACKTRACE: enable=yes,interactive=no,color=no,threads=crashed,registers=none,images=none,limit=48,top=0,sanitize=yes,output-to=stderr,timeout=10s,warnings=suppressed
        run: |
          set +e
          python3 scripts/run-native-tests.py --skip-build --jobs 1 --filter '^VaneTests.WebKitExtensionUserAgentPolicyProbeTests/testFullUserAgentPolicyAgainstPublicBackgroundCallbackControl$' 2>&1 | tee "$RUNNER_TEMP/vane-ua-policy-policy.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          if (( statuses[0] != 0 || statuses[1] != 0 )); then exit 1; fi
          if grep -Eq '^\*\*\* Signal [0-9]+: Backtracing' "$RUNNER_TEMP/vane-ua-policy-policy.log"; then exit 1; fi
          grep -Fq "Test Case '-[VaneTests.WebKitExtensionUserAgentPolicyProbeTests testFullUserAgentPolicyAgainstPublicBackgroundCallbackControl]' passed" "$RUNNER_TEMP/vane-ua-policy-policy.log" || { echo '::error::Expected worker policy case did not pass.'; exit 1; }
          grep -Fq 'Native suite primary status=0; cleanup status=0' "$RUNNER_TEMP/vane-ua-policy-policy.log" || { echo '::error::Worker policy cleanup was not verified.'; exit 1; }

      - name: CLI password import errors
        run: bash scripts/test-cli-import.sh .build/debug/vane

      - name: Release workflow fixture
        run: python3 scripts/test-release-workflow.py

      - name: Cloud AI transport and privacy checks
        run: scripts/check-cloud-ai.sh

      - name: Bundle
        run: ./make-app.sh debug

      - name: Default browser prompt build policy
        run: python3 scripts/test-default-browser-prompt.py

      - name: Save source timestamps for the build cache
        run: python3 scripts/ci-source-state.py save

      - name: DMG package
        run: ./scripts/test-build-dmg.sh

      - name: Updater interruption, rollback, transport and relaunch recovery
        run: |
          scripts/test-updater-recovery.sh
          bash scripts/test-update-launch-ownership.sh
          python3 scripts/test-updater-transport.py
          python3 scripts/test-updater-archive.py
          scripts/test-updater-relaunch.sh

      - name: Update installer rejection and quarantine cleanup
        run: bash scripts/test-update-installer.sh Vane.app --unsigned

      - name: Save Swift debug build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.swift-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .build
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}

  prune-caches:
    # Keep deletion credentials away from the build and from pull request runs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep the two newest Swift debug caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh cache list --ref refs/heads/main --key swift-debug-v2- \
            --limit 10000 --sort created_at --order desc --json id \
            --jq '.[2:] | .[].id' > "$RUNNER_TEMP/stale-cache-ids"
          while IFS= read -r cache_id; do
            gh cache delete "$cache_id"
          done < "$RUNNER_TEMP/stale-cache-ids"
