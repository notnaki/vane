name: Extension cache native preflight
on:
  workflow_dispatch:
    inputs:
      native_filter:
        description: Focused cases
        required: true
        default: 'DraftProtectionTests|ExtensionBackgroundStartupTests|ExtensionBackgroundWatchdogTests|ExtensionUserAgentTests'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Select supported toolchain
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Build actual diagnostic tree
        run: swift build --build-system native --build-tests --jobs 4
      - name: Focused native repetitions
        env:
          NATIVE_FILTER: ${{ inputs.native_filter }}
          NSUnbufferedIO: 'YES'
        shell: bash
        run: |
          set -uo pipefail
          set +e
          status=0
          for attempt in 1 2 3; do
            python3 scripts/run-native-tests.py --build-system native --skip-build --jobs 1 --filter "$NATIVE_FILTER" 2>&1 | tee "$RUNNER_TEMP/cache-preflight-$attempt.log"
            code=${PIPESTATUS[0]}
            if [ "$code" -ne 0 ]; then status=1; fi
          done
          exit "$status"
      - name: Collect system diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cache-diagnostics"
          log show --last 10m --style compact --predicate 'process == "xctest"' > "$RUNNER_TEMP/cache-diagnostics/system.log" 2>&1 || true
          shopt -s nullglob
          for report in "$HOME"/Library/Logs/DiagnosticReports/xctest*; do cp "$report" "$RUNNER_TEMP/cache-diagnostics/"; done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cache-preflight-diagnostics
          path: |
            ${{ runner.temp }}/cache-preflight-*.log
            ${{ runner.temp }}/cache-diagnostics
