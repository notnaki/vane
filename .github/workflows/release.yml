# Temporary diagnostic branch only. Do not merge this workflow replacement.
name: Focused native diagnostics
run-name: Library focus ${{ inputs.scenario }} — ${{ github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      scenario:
        type: choice
        description: Isolated focus or the short preceding CI context
        default: context
        options: [context, isolated]
permissions:
  contents: read
concurrency:
  group: focused-library-${{ github.ref }}
  cancel-in-progress: true
jobs:
  library-focus:
    name: Focused Library tests (${{ inputs.scenario }})
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Identify toolchain
        id: toolchain
        run: echo "key=$(python3 scripts/ci-build-artifact.py toolchain)" >> "$GITHUB_OUTPUT"
      - name: Restore debug cache
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: swift-debug-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ hashFiles('Sources/**/*.swift') }}
          restore-keys: |
            swift-debug-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - name: Restore unchanged timestamps
        run: python3 scripts/ci-source-state.py restore
      - name: Build test bundle once
        run: swift build --build-system native -c debug --build-tests
      - name: Repeat Library focus tests
        timeout-minutes: 10
        env:
          VANE_NATIVE_FIXTURE_PRIMARY_TIMEOUT: '120'
          SCENARIO: ${{ inputs.scenario }}
        run: |
          set -euo pipefail
          case "$SCENARIO" in
            isolated)
              repetitions=10
              classes='Feel05LibraryFocusTests'
              filter='^VaneTests[.]Feel05LibraryFocusTests/'
              ;;
            context)
              repetitions=3
              classes='Feel02PressTests Feel02SidebarTests Feel03RemoteTests Feel03SearchTests Feel04PreviewTests Feel04SkippedLoadTests Feel05LibraryFocusTests'
              filter='^VaneTests[.](Feel02PressTests|Feel02SidebarTests|Feel03RemoteTests|Feel03SearchTests|Feel04PreviewTests|Feel04SkippedLoadTests|Feel05LibraryFocusTests)/'
              ;;
            *) exit 64 ;;
          esac
          started=$SECONDS
          for iteration in $(seq 1 "$repetitions"); do
            # Leave six minutes for an admitted attempt and bounded retirement.
            # A slow incomplete series fails instead of starting work at the deadline.
            if (( SECONDS - started > 240 )); then
              echo '::error::Focused series incomplete; preserving cleanup time.'
              exit 1
            fi
            log="$RUNNER_TEMP/library-focus-$iteration.log"
            if ! python3 scripts/run-native-tests.py --build-system native --skip-build --jobs 1 --filter "$filter" > "$log" 2>&1; then
              cat "$log"
              exit 1
            fi
            cat "$log"
            grep -Fq 'Native suite primary status=0; cleanup status=0' "$log"
            for test_class in $classes; do
              grep -Fq "Test Suite '$test_class' passed" "$log"
            done
            grep -Fq "Test Case '-[VaneTests.Feel05LibraryFocusTests testSectionChangesReachCurrentSearchWithAndWithoutBatterySaver]' passed" "$log"
            if grep -Eq '^\*\*\* Signal [0-9]+: Backtracing' "$log"; then exit 1; fi
          done
      - name: Preserve focused evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: focused-library-evidence
          path: ${{ runner.temp }}/library-focus-*.log
          retention-days: 7
