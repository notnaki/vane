# Temporary diagnostic branch only; never merge this workflow replacement.
name: Focused sidebar and packaging preflight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: focused-folder-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        id: toolchain
        run: echo "key=$(python3 scripts/ci-build-artifact.py toolchain)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: cache
        with:
          path: .build
          key: focused-folder-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**/*.swift', 'Tests/**/*.swift') }}
          restore-keys: |
            focused-folder-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-
            focused-folder-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-
            swift-debug-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - run: python3 scripts/ci-source-state.py restore
      - run: swift build --build-system native -c debug --build-tests
      - run: python3 scripts/ci-source-state.py save
      - uses: actions/cache/save@v6
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: .build
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Discover focused inventory
        run: |
          swift test --build-system native list --skip-build > "$RUNNER_TEMP/folder-all-tests.txt"
          python3 - "$RUNNER_TEMP" <<'PY'
          import pathlib, sys
          directory = pathlib.Path(sys.argv[1])
          wanted = {'FolderRolloutTests', 'BufferedSidebarInteractionTests', 'SidebarHoverLayoutTests', 'SpacePreviewParityTests', 'NativeSidebarStableOwnershipTests'}
          tests = [line.strip() for line in (directory / 'folder-all-tests.txt').read_text().splitlines() if '/' in line and line.strip().split('/')[0].removeprefix('VaneTests.') in wanted]
          assert {test.split('/')[0].removeprefix('VaneTests.') for test in tests} == wanted
          assert len(tests) == 45, (len(tests), tests)
          (directory / 'folder-selected-tests.txt').write_text('\n'.join(tests) + '\n')
          PY
          python3 scripts/native-test-shards.py plan --inventory "$RUNNER_TEMP/folder-selected-tests.txt" --suite all --index 1 --count 1 --manifest "$RUNNER_TEMP/folder-selected.json" --filter-output "$RUNNER_TEMP/folder-selected.filter"
      - name: Three predetermined native cohorts
        timeout-minutes: 10
        env:
          VANE_NATIVE_FIXTURE_PRIMARY_TIMEOUT: '180'
        run: |
          set -euo pipefail
          started=$SECONDS
          for iteration in 1 2 3; do
            if (( SECONDS - started > 360 )); then exit 1; fi
            log="$RUNNER_TEMP/folder-qualified-$iteration.log"
            export VANE_SIDEBAR_SNAPSHOT_DIR="$RUNNER_TEMP/folder-snapshots-$iteration"
            if ! python3 scripts/run-native-tests.py --build-system native --skip-build --jobs 1 --filter "$(cat "$RUNNER_TEMP/folder-selected.filter")" > "$log" 2>&1; then
              cat "$log"
              exit 1
            fi
            cat "$log"
            python3 scripts/native-test-shards.py verify --manifest "$RUNNER_TEMP/folder-selected.json" --log "$log"
          done
      - name: Busy-detach packaging integration
        run: |
          set -o pipefail
          ./scripts/test-build-dmg.sh 2>&1 | tee "$RUNNER_TEMP/folder-packaging.log"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: focused-sidebar-evidence
          path: |
            ${{ runner.temp }}/folder-*.log
            ${{ runner.temp }}/folder-selected*.json
            ${{ runner.temp }}/folder-snapshots-*/
