# Temporary diagnostic branch only; never merge this workflow replacement.
name: Focused folder motion diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: focused-folder-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        id: toolchain
        run: echo "key=$(python3 scripts/ci-build-artifact.py toolchain)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: cache
        with:
          path: .build
          key: focused-folder-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**/*.swift', 'Tests/**/*.swift') }}
          restore-keys: |
            swift-debug-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - run: python3 scripts/ci-source-state.py restore
      - run: swift build --build-system native -c debug --build-tests
      - run: python3 scripts/ci-source-state.py save
      - uses: actions/cache/save@v6
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: .build
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Unqualified animation control
        env:
          VANE_NATIVE_FIXTURE_PRIMARY_TIMEOUT: '180'
        run: |
          set +e
          python3 scripts/run-native-tests.py --build-system native --skip-build --jobs 1 --filter '^VaneTests[.]FolderRolloutControlTests/' > "$RUNNER_TEMP/folder-control.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/folder-control.log"
          echo "CONTROL_DRIVER_STATUS=$status"
          grep -q 'cleanup status=0' "$RUNNER_TEMP/folder-control.log"
          grep -q "FolderRolloutControlTests.*testNewFolderChildrenRollDownFromTheirHeaderAcrossNativeOwners.*\(passed\|failed\)" "$RUNNER_TEMP/folder-control.log"
      - name: Qualified folder and legacy keyboard checks
        timeout-minutes: 10
        env:
          VANE_NATIVE_FIXTURE_PRIMARY_TIMEOUT: '180'
        run: |
          set -euo pipefail
          started=$SECONDS
          for iteration in 1 2 3; do
            if (( SECONDS - started > 240 )); then exit 1; fi
            log="$RUNNER_TEMP/folder-admitted-$iteration.log"
            if ! python3 scripts/run-native-tests.py --build-system native --skip-build --jobs 1 --filter '^VaneTests[.](FolderRolloutTests|BufferedSidebarInteractionTests)/' > "$log" 2>&1; then
              cat "$log"
              exit 1
            fi
            cat "$log"
            grep -q 'Native suite primary status=0; cleanup status=0' "$log"
            grep -q "FolderRolloutTests.*testNewFolderChildrenRollDownFromTheirHeaderAcrossNativeOwners.*passed" "$log"
            grep -q "BufferedSidebarInteractionTests.*testFocusedRowRemainsMountedAcrossScrollAndStillReceivesSpace.*passed" "$log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-folder-evidence
          path: |
            ${{ runner.temp }}/folder-*.log
