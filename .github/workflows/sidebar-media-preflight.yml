name: sidebar-media-preflight

on:
  push:
    branches: [codex/sidebar-colours-media-preflight]

permissions:
  contents: read

concurrency:
  group: sidebar-media-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  media:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      VANE_NATIVE_FIXTURE_PRIMARY_TIMEOUT: 300
    steps:
      - uses: actions/checkout@v7
      - name: Identify Swift toolchain
        id: toolchain
        run: |
          set -euo pipefail
          echo "key=$(python3 scripts/ci-build-artifact.py toolchain)" >> "$GITHUB_OUTPUT"
          sw_vers
          swift --version
      - name: Restore shared debug cache
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: swift-debug-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ hashFiles('Sources/**/*.swift') }}
          restore-keys: |
            swift-debug-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - name: Restore unchanged source timestamps
        run: python3 scripts/ci-source-state.py restore
      - name: Build once
        run: swift build --build-system native -c debug --build-tests
      - name: Owned AppKit loop preflight
        run: |
          set -euo pipefail
          python3 scripts/run-native-tests.py --build-system native --skip-build --jobs 1 --filter '^VaneTests[.]NativeApplicationLoopSmokeTests/testOwnedLoopAdmitsAsyncWorkAndStops$' 2>&1 | tee "$RUNNER_TEMP/sidebar-media-loop.log"
          grep -Fq 'Native suite primary status=0; cleanup status=0' "$RUNNER_TEMP/sidebar-media-loop.log"
      - name: Three planned media regression attempts
        run: |
          set -euo pipefail
          failed=0
          for attempt in 1 2 3; do
            if python3 scripts/run-native-tests.py --build-system native --skip-build --jobs 1 --filter MediaControlsWebKitTests 2>&1 | tee "$RUNNER_TEMP/sidebar-media-attempt-$attempt.log"; then
              grep -Fq "Test Suite 'MediaControlsWebKitTests' passed" "$RUNNER_TEMP/sidebar-media-attempt-$attempt.log" || failed=1
              grep -Fq 'Native suite primary status=0; cleanup status=0' "$RUNNER_TEMP/sidebar-media-attempt-$attempt.log" || failed=1
            else
              failed=1
            fi
          done
          exit "$failed"
      - name: Preserve every attempt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sidebar-media-preflight-evidence
          path: ${{ runner.temp }}/sidebar-media-*.log
          retention-days: 7
