name: One owned SwiftUI Library attribution trace
on:
  push:
    branches: [codex/library-staging-preflight-20261114]
permissions:
  contents: read
env:
  VANE_EXPECTED_TESTS: |
    VaneTests.WindowResizeLayoutTests/testLibraryNavigationKeepsTheResponsiveDocumentPainted
  VANE_CANDIDATE_SHA: '3bcc08e7729bcd7544f9a030499f453feb427cec'
  VANE_LIBRARY_PAINT_TRACE: '0'
  VANE_LIBRARY_LAYOUT_TRACE: '1'
  VANE_DIAGNOSTIC_FILTER: '^VaneTests[.]WindowResizeLayoutTests/testLibraryNavigationKeepsTheResponsiveDocumentPainted$'
jobs:
  library-receipt:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.VANE_CANDIDATE_SHA }}
      - name: Verify exact diagnostic source and actual runner
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VANE_CANDIDATE_SHA"
          git log -1 --format=fuller | tee "$RUNNER_TEMP/vane-diag-source.txt"
          sw_vers | tee -a "$RUNNER_TEMP/vane-diag-source.txt"
          uname -m | tee -a "$RUNNER_TEMP/vane-diag-source.txt"
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          test "$(uname -m)" = arm64
      - name: Verify SwiftUI template on the actual ARM26 runner
        run: |
          mkdir -p "$RUNNER_TEMP/swiftui-owner"
          xcrun xctrace list templates > "$RUNNER_TEMP/swiftui-owner/templates.txt" 2>&1
          python3 - <<'TEMPLATE'
          import pathlib,os
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'swiftui-owner/templates.txt'
          assert 'SwiftUI' in [line.strip() for line in p.read_text().splitlines()], 'SwiftUI template unavailable; no capture or fallback'
          TEMPLATE
      - name: Identify Swift toolchain
        id: toolchain
        run: |
          set -euo pipefail
          swift --version
          xcodebuild -version
          KEY=$(python3 scripts/ci-build-artifact.py toolchain)
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      # Only checks builds go into this cache. Release builds compile an OAuth secret
      # into the app, so their build products must never enter a PR-readable cache.
      # PRs reuse main's cache without leaving a separate archive for every revision.
      - name: Restore Swift debug build
        id: swift-cache
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: swift-debug-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ hashFiles('Sources/**', 'Tests/**', 'scripts/ci-source-state.py', 'make-app.sh', '.github/workflows/checks.yml') }}
          restore-keys: |
            swift-debug-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
            swift-debug-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-

      # Checkout gives even unchanged inputs new mtimes. Restore only content-matching
      # timestamps for Swift, C/Objective-C bridges, headers and resources. Rebuilding
      # an unchanged bridge can invalidate all dependent Swift compilation.
      - name: Restore unchanged source timestamps
        run: python3 scripts/ci-source-state.py restore

      - name: Build exact reviewed product candidate
        run: swift build -c debug --build-tests --disable-index-store --jobs 3
      - name: Admit actual system motion on this disposable runner
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/vane-motion-probe.swift" <<'SWIFT'
          import AppKit
          import Foundation
          let reduced = NSWorkspace.shared.accessibilityDisplayShouldReduceMotion
          print("MOTION_ADMISSION reduceMotion=\(reduced) screens=\(NSScreen.screens.map(\.frame))")
          if CommandLine.arguments.contains("--require-motion") && reduced { exit(78) }
          SWIFT
          swiftc "$RUNNER_TEMP/vane-motion-probe.swift" -o "$RUNNER_TEMP/vane-motion-probe"
          "$RUNNER_TEMP/vane-motion-probe" | tee "$RUNNER_TEMP/vane-motion-admission.log"
          defaults write com.apple.universalaccess reduceMotion -bool false
          defaults -currentHost write com.apple.universalaccess reduceMotion -bool false
          admitted=false
          for attempt in {1..10}; do
            echo "Motion admission attempt $attempt" >> "$RUNNER_TEMP/vane-motion-admission.log"
            if "$RUNNER_TEMP/vane-motion-probe" --require-motion >> "$RUNNER_TEMP/vane-motion-admission.log"; then admitted=true; break; fi
            sleep 0.5
          done
          cat "$RUNNER_TEMP/vane-motion-admission.log"
          test "$admitted" = true
      - name: Owned AppKit loop preflight
        timeout-minutes: 4
        env:
          VANE_APPKIT_LOOP_SMOKE: '1'
          VANE_NATIVE_FIXTURE_PRIMARY_TIMEOUT: '90'
          SWIFT_BACKTRACE: enable=yes,interactive=no,color=no,threads=crashed,registers=none,images=none,limit=48,top=0,sanitize=yes,output-to=stderr,timeout=10s,warnings=suppressed
        run: |
          set -euo pipefail
          python3 scripts/run-native-tests.py --skip-build --jobs 1 --filter '^VaneTests[.]NativeApplicationLoopSmokeTests/testOwnedLoopAdmitsAsyncWorkAndStops$' 2>&1 | tee "$RUNNER_TEMP/vane-motion-smoke.log"
          grep -Fq 'AppKit loop smoke: delayedHeartbeat=true, completed=true' "$RUNNER_TEMP/vane-motion-smoke.log"
          grep -Fxq 'Native suite primary status=0; cleanup status=0' "$RUNNER_TEMP/vane-motion-smoke.log"
          if grep -Eq '^\*\*\* Signal [0-9]+: Backtracing' "$RUNNER_TEMP/vane-motion-smoke.log"; then exit 1; fi
      - name: Discover exact original Library and profile methods
        run: |
          set -euo pipefail
          swift test list --skip-build > "$RUNNER_TEMP/vane-diag-inventory.txt"
          python3 - <<'PYCODE'
          import pathlib,os,re,json
          r=pathlib.Path(os.environ['RUNNER_TEMP']);pattern=re.compile(os.environ['VANE_DIAGNOSTIC_FILTER'])
          tests=[t.strip() for t in (r/'vane-diag-inventory.txt').read_text().splitlines() if t.startswith('VaneTests.') and pattern.search(t.strip())]
          expected=set(os.environ['VANE_EXPECTED_TESTS'].splitlines())
          assert set(tests)==expected and len(tests)==len(expected), f'Incorrect selected cases: expected={sorted(expected)} actual={tests}'
          (r/'vane-diag-manifest.json').write_text(json.dumps({'schema':1,'tests':tests},indent=2)+'\n')
          print('Selected diagnostic methods:',len(tests))
          PYCODE
      - name: Record one exact owned UI SwiftUI trace (diagnostic only)
        timeout-minutes: 24
        env:
          VANE_NATIVE_FIXTURE_PRIMARY_TIMEOUT: '1200'
          SWIFT_BACKTRACE: enable=yes,interactive=no,color=no,threads=crashed,registers=none,images=none,limit=48,top=0,sanitize=yes,output-to=stderr,timeout=10s,warnings=suppressed
        run: |
          cat > "$RUNNER_TEMP/owned-swiftui-diagnostic.py" <<'OWNED'
          #!/usr/bin/env python3
          """Diagnostic-only wrapper: preserve native status; record SwiftUI for one exact owned XCTest.
          Usage: python3 owned-sample-diagnostic.py EVIDENCE_DIR -- ORIGINAL_NATIVE_COMMAND...
          One 10-second capture of the original Library method; no retry or fallback.
          No source hooks or changes to test timing/assertions. Derived from the existing owned-process wrapper.
          """
          import datetime,json,os,pathlib,re,subprocess,sys,time
          out=pathlib.Path(sys.argv[1]);out.mkdir(parents=True,exist_ok=True)
          assert sys.argv[2]=='--' and len(sys.argv)>3
          cwd=pathlib.Path.cwd().resolve();build=str(cwd/'.build')+'/'
          record={'diagnostic_only':True,'collector':'SwiftUI Instruments','duration_seconds':10,'command':sys.argv[3:],'started':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          sampler=None;sampling_log=None;sample_started=None;sample_status=None
          with (out/'native.log').open('w') as native:
           primary=subprocess.Popen(sys.argv[3:],stdout=native,stderr=subprocess.STDOUT)
           while primary.poll() is None:
            if sampler is None and not record.get('watch_disabled'):
             try:
              rows=[]
              for line in subprocess.check_output(['ps','-axo','pid=,ppid=,lstart=,command='],text=True).splitlines():
               match=re.match(r'\s*(\d+)\s+(\d+)\s+(\S+\s+\S+\s+\d+\s+\S+\s+\d+)\s+(.*)',line)
               if match:rows.append((int(match[1]),int(match[2]),match[3],match[4]))
              owned={primary.pid}
              for _ in range(8):
               for pid,ppid,start,command in rows:
                if ppid in owned:owned.add(pid)
              candidates=[(pid,start,command) for pid,ppid,start,command in rows if pid in owned and command.startswith('/Applications/Xcode') and '/xctest ' in command and build in command and 'testLibraryNavigationKeepsTheResponsiveDocumentPainted' in command]
              if candidates:
               assert len(candidates)==1
               pid,start,command=candidates[0]
               verified=subprocess.check_output(['ps','-p',str(pid),'-o','lstart=,command='],text=True).strip()
               assert verified.startswith(start) and verified.endswith(command)
               record['sample_host']={'pid':pid,'start':start,'command':command}
               sampling_log=(out/'recorder.log').open('w')
               sampler=subprocess.Popen(['xcrun','xctrace','record','--template','SwiftUI','--attach',str(pid),'--time-limit','10s','--output',str(out/'library-owner.trace')],stdout=sampling_log,stderr=subprocess.STDOUT)
               record['sample_pid']=sampler.pid;sample_started=time.monotonic();record['record_launched_utc']=datetime.datetime.now(datetime.timezone.utc).isoformat()
             except Exception as error:
              record.setdefault('watch_errors',[]).append(type(error).__name__+': '+str(error))
              # Keep the original native wrapper running through its owned cleanup even
              # if process discovery fails. A diagnostic error must never orphan it.
              record['watch_disabled']=True
            elif sampler is not None and sampler.poll() is not None and not record.get('post_checked'):
             record['post_checked']=True
             record['record_returned_utc']=datetime.datetime.now(datetime.timezone.utc).isoformat()
             try:
              rows=[]
              for line in subprocess.check_output(['ps','-axo','pid=,ppid=,lstart=,command='],text=True).splitlines():
               match=re.match(r'\s*(\d+)\s+(\d+)\s+(\S+\s+\S+\s+\d+\s+\S+\s+\d+)\s+(.*)',line)
               if match:rows.append((int(match[1]),int(match[2]),match[3],match[4]))
              owned={primary.pid}
              for _ in range(8):
               for child,parent,began,executable in rows:
                if parent in owned:owned.add(child)
              identity=record['sample_host']
              actual=[(child,began,executable) for child,parent,began,executable in rows if child==identity['pid']]
              record['sample_host_after']=actual
              record['ownership_held']=identity['pid'] in owned and actual==[(identity['pid'],identity['start'],identity['command'])]
             except Exception as error:
              record['ownership_held']=False
              record['post_error']=type(error).__name__+': '+str(error)
            elif sampler is not None and sampler.poll() is None and time.monotonic()-sample_started>60:
             # Popen retains the unreaped child identity; only this exact owned sampler is stopped.
             sampler.terminate()
             try:sampler.wait(timeout=5)
             except subprocess.TimeoutExpired:sampler.kill();sampler.wait()
             record['sample_timeout']=True
            time.sleep(.05)
           primary_status=primary.wait()
          if sampler is not None:
           try:sample_status=sampler.wait(timeout=max(1,60-(time.monotonic()-sample_started)))
           except subprocess.TimeoutExpired:
            sampler.terminate()
            try:sample_status=sampler.wait(timeout=5)
            except subprocess.TimeoutExpired:sampler.kill();sample_status=sampler.wait()
            record['sample_timeout']=True
           sampling_log.close()
          record['collection_status']=0 if sample_status==0 and (out/'library-owner.trace').exists() and record.get('ownership_held') and not record.get('sample_timeout') and not record.get('watch_errors') else 1
          record.update(primary_status=primary_status,sample_status=sample_status,sample_exists=(out/'library-owner.trace').exists(),finished=datetime.datetime.now(datetime.timezone.utc).isoformat())
          (out/'diagnostic-status.json').write_text(json.dumps(record,indent=2)+'\n')
          print(json.dumps(record))
          sys.exit(primary_status or (0 if sample_status==0 and record['sample_exists'] and record.get('ownership_held') and not record.get('sample_timeout') and not record.get('watch_errors') else 1))
          OWNED
          python3 "$RUNNER_TEMP/owned-swiftui-diagnostic.py" "$RUNNER_TEMP/swiftui-owner" -- python3 scripts/run-native-tests.py --skip-build --jobs 1 --filter "$VANE_DIAGNOSTIC_FILTER"
      - name: Export retained SwiftUI owner event tables without another recording
        if: ${{ always() }}
        run: |
          python3 - <<'EXPORT'
          import json,os,pathlib,subprocess,xml.etree.ElementTree as ET
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'swiftui-owner'
          result={'diagnosticOnly':True,'sourceAttribution':'PENDING evidence inspection','exports':[]}
          try:
              state=json.loads((root/'diagnostic-status.json').read_text())
              assert state['collection_status']==0, 'Capture unavailable/incomplete; retain without retry'
              trace=root/'library-owner.trace';toc=root/'toc.xml'
              subprocess.run(['xcrun','xctrace','export','--input',str(trace),'--toc','--output',str(toc)],check=True,timeout=60)
              tree=ET.parse(toc)
              for run in tree.findall('.//run'):
                  number=run.attrib.get('number','1')
                  for i,table in enumerate(run.findall('./data/table')):
                      schema=table.attrib.get('schema','')
                      if 'swiftui' not in schema.lower(): continue
                      target=root/f'run-{number}-table-{i}.xml'
                      query=f'/trace-toc/run[@number="{number}"]/data/table[@schema="{schema}"]'
                      exported=subprocess.run(['xcrun','xctrace','export','--input',str(trace),'--xpath',query,'--output',str(target)],timeout=60)
                      result['exports'].append({'run':number,'schema':schema,'file':target.name,'returncode':exported.returncode})
              assert result['exports'] and all(e['returncode']==0 for e in result['exports']), 'No complete SwiftUI exports; no retry/fallback'
              result['exportStatus']=0
          except Exception as error:
              result.update(exportStatus=1,error=type(error).__name__+': '+str(error))
          root.mkdir(exist_ok=True)
          (root/'export-status.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          raise SystemExit(result['exportStatus'])
          EXPORT
      - name: Retain diagnostic evidence including failed attempts
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: public-native-logs
          path: |
            ${{ runner.temp }}/vane-diag-tests.log
            ${{ runner.temp }}/swiftui-owner
            ${{ runner.temp }}/owned-swiftui-diagnostic.py
            ${{ runner.temp }}/vane-diag-source.txt
            /tmp/vane-resize-library-*
            ${{ runner.temp }}/profile-boundary-costs
            ${{ runner.temp }}/vane-diag-manifest.json
            ${{ runner.temp }}/vane-diag-inventory.txt
            ${{ runner.temp }}/vane-motion-admission.log
            ${{ runner.temp }}/vane-motion-smoke.log
          if-no-files-found: ignore
          retention-days: 7
