name: Page menu CI rendering preflight
on:
  push:
    branches: [codex/page-menu-ci-preflight]
permissions:
  contents: read
  actions: read
jobs:
  footer:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Identify Swift toolchain
        id: toolchain
        run: echo "key=$(python3 scripts/ci-build-artifact.py toolchain)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        with:
          path: .build
          key: footer-preflight-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ github.sha }}
          restore-keys: |
            swift-debug-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-
      - name: Restore matching source timestamps
        run: python3 scripts/ci-source-state.py restore
      - name: Build focused fixture runtime once
        run: swift build --build-system native -c debug --build-tests
      - name: Admit owned AppKit loop
        env:
          VANE_APPKIT_LOOP_SMOKE: '1'
          VANE_NATIVE_FIXTURE_PRIMARY_TIMEOUT: '90'
        run: python3 scripts/run-native-tests.py --build-system native --skip-build --jobs 1 --filter '^VaneTests[.]NativeApplicationLoopSmokeTests/testOwnedLoopAdmitsAsyncWorkAndStops$'
      - name: Preserve three focused attempts
        env:
          VANE_NATIVE_FIXTURE_PRIMARY_TIMEOUT: '180'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/footer-preflight"
          status=0
          for attempt in 1 2 3; do
            set +e
            VANE_FOOTER_RENDER_DIR="$RUNNER_TEMP/footer-preflight/render-$attempt" python3 scripts/run-native-tests.py --build-system native --skip-build --jobs 1 --filter 'SidebarChromeTests|SidebarNativeReadinessTests|SidebarPresentationPerformanceTests|SidebarViewportPerformanceTests|SitePermissionWebTests|SpaceButtonSelectionTests|SpaceColourTransitionTests|SpaceFooterMarkerTests|SpaceFooterPresentationTests|SpaceIconTests' 2>&1 | tee "$RUNNER_TEMP/footer-preflight/attempt-$attempt.log"
            results=("${PIPESTATUS[@]}")
            set -e
            printf 'attempt=%s primary=%s tee=%s\n' "$attempt" "${results[0]}" "${results[1]}" >> "$RUNNER_TEMP/footer-preflight/results.txt"
            if [ "${results[0]}" != 0 ] || [ "${results[1]}" != 0 ]; then status=1; fi
          done
          exit "$status"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: footer-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/footer-preflight
          retention-days: 7
