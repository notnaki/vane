wnNativeChildLayoutPreparesBothCSSAxesBehindFixedHostClip|VaneTests\.LivePageResizeBufferTests/testUnshownTitledWindowPrimePreparesNativeChildrenAndBothCSSAxesBehindHostClip|VaneTests\.LivePageResizeBufferTests/testWatchdogUsesLatestRequestAndLateCallbacksCannotCommitAgain|VaneTests\.LivePageResizeBufferTests/testWindowDragDoesNotScheduleSidebarMetadataAcknowledgmentLayout|VaneTests\.LivePageResizeBufferTests/testWindowFrameRevalidatesOwnershipBeforePublishing|VaneTests\.LivePageResizeBufferTests/testWindowPublicationReleaseDrainsWithoutAnotherDisplayTick|VaneTests\.LivePageResizeBufferTests/testWindowPublicationsCoalesceAtDisplayFramesAndStillRequirePaint|VaneTests\.LivePageResizeBufferTests/testWindowWatchdogStopsFrameClockAndRetainsImmediateNativeFallback|VaneTests\.SidebarResizePublicationTests/testCancelDuringSubmittedParentWaitDropsReleaseAndPreservesNewPageOwner|VaneTests\.SidebarResizePublicationTests/testCancellationDiscardsQueuedValueAndRejectsLateFrameAndRelease|VaneTests\.SidebarResizePublicationTests/testCoalescedParentAcknowledgmentClearsSubmittedFloorBeforeExactPaint|VaneTests\.SidebarResizePublicationTests/testCoalescedReturnToBaselineFinishesWithoutAnyRepresentableUpdateOrWatchdog|VaneTests\.SidebarResizePublicationTests/testDroppingOwnerInvalidatesDriverWithoutRetainingPublication|VaneTests\.SidebarResizePublicationTests/testEqualBoundsWithStaleMetadataDoNotAcknowledgeEarlierWiderSubmissionDuringDrag|VaneTests\.SidebarResizePublicationTests/testFittedEquivalentWidthDoesNotForceNativeLayout|VaneTests\.SidebarResizePublicationTests/testFrameHookFollowsOneLatestPublicationAndNeverAnEmptyFrameOrRelease|VaneTests\.SidebarResizePublicationTests/testFrameHookRejectsCancellationFinishAndOwnerReplacementDuringPublish|VaneTests\.SidebarResizePublicationTests/testFramePublishesOnlyLatestWidthAndDoesNotRepeatIdleValues|VaneTests\.SidebarResizePublicationTests/testFrameRejectsReplacedStoreRootPageOrWindowBeforePublishing|VaneTests\.SidebarResizePublicationTests