name: iCloud current-main native preflight
on:
  push:
    branches: [codex/icloud-final-preflight-20261111]
permissions:
  contents: read
  actions: read
env:
  VANE_NATIVE_FIXTURE_PRIMARY_TIMEOUT: '90'
  SWIFT_BACKTRACE: enable=yes,interactive=no,color=no,threads=crashed,registers=none,images=none,limit=48,top=0,sanitize=yes,output-to=stderr,timeout=10s,warnings=suppressed
jobs:
  focused:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Identify diagnostic cache toolchain
        id: toolchain
        run: echo "key=$(python3 scripts/ci-build-artifact.py toolchain)" >> "$GITHUB_OUTPUT"
      - name: Restore diagnostic debug build
        id: diagnostic-cache
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: native-diag-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**') }}
          restore-keys: |
            native-diag-${{ steps.toolchain.outputs.key }}-
            swift-debug-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - name: Restore unchanged source timestamps
        run: python3 scripts/ci-source-state.py restore
      - name: Build diagnostic runtime
        run: swift build -c debug --build-tests --disable-index-store
      - name: Preserve source timestamps for diagnostic debug cache
        run: python3 scripts/ci-source-state.py save
      - name: Save compiled diagnostic debug build before native assertions
        uses: actions/cache/save@v6
        with:
          path: .build
          key: ${{ steps.diagnostic-cache.outputs.cache-primary-key }}
      - name: Bundle compiled application
        env:
          VANE_CI_TOOLCHAIN_KEY: ${{ steps.toolchain.outputs.key }}
        run: ./make-app.sh debug --skip-app-build
      - name: Enable and verify animated motion on the hosted desktop
        run: |
          defaults write com.apple.universalaccess reduceMotion -bool false
          swift -e 'import AppKit; let reduced = NSWorkspace.shared.accessibilityDisplayShouldReduceMotion; print("HOST_REDUCE_MOTION=\(reduced)"); exit(reduced ? 1 : 0)'
      - name: Predetermined focused attempt with retirement
        env:
          ATTEMPT: '1'
        run: |
          python3 - <<'PYTHON'
          import errno, os, pathlib, pty, subprocess, sys
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          attempt = os.environ['ATTEMPT']
          selection = 'SpaceNativeRenderingTests.testCachedProfileChangesPageAtStartOfNativeLanding'
          os.environ['VANE_DIAG_GESTURE_MARKER'] = str(root / 'icloud-gesture-start.json')
          source = pathlib.Path('scripts/run-native-tests.py').read_text().replace('import ctypes\n', 'import ctypes\nimport threading\n')
          collector = """    diagnostic_stop = threading.Event()
              def collect_gesture():
                  try:
                      marker = Path(os.environ['VANE_DIAG_GESTURE_MARKER'])
                      deadline = time.monotonic() + 80
                      while not diagnostic_stop.wait(0.01) and time.monotonic() < deadline:
                          if not marker.exists(): continue
                          event = json.loads(marker.read_text())
                          for record in load_records(directory, token):
                              host = record['host']
                              if host['pid'] != event['pid']: continue
                              if process_identity(host['pid']) != {'pid': host['pid'], 'start': host['start'], 'path': os.path.realpath(host['path'])}: continue
                              root = Path(os.environ['RUNNER_TEMP'])
                              print('GESTURE_STACK host=' + str(host['pid']) + ' delayMS=' + str((time.monotonic() - event['time']) * 1000), flush=True)
                              with (root / 'icloud-sampler.log').open('w') as output:
                                  sampler = subprocess.Popen(['sample', str(host['pid']), '1', '1', '-file', str(root / 'icloud-gesture-stack.txt')], stdout=output, stderr=subprocess.STDOUT)
                                  try: sampler.wait(timeout=60)
                                  except subprocess.TimeoutExpired:
                                      sampler.terminate()
                                      try: sampler.wait(timeout=5)
                                      except subprocess.TimeoutExpired:
                                          sampler.kill(); sampler.wait()
                                      print('GESTURE_STACK sampler timeout; native driver remains independent', flush=True)
                              return
                  except Exception as error: print('GESTURE_STACK failed: ' + str(error), flush=True)
              diagnostic_collector = threading.Thread(target=collect_gesture)
              diagnostic_collector.start()
          """
          needle = '    try:\n        status = run_commands(primary, cleanup, invoke, check_hosts)'
          assert source.count(needle) == 1
          source = source.replace(needle, collector + needle)
          needle = '    finally:\n        for signum, handler in previous.items():'
          assert source.count(needle) == 1
          source = source.replace(needle, '    finally:\n        diagnostic_stop.set()\n        diagnostic_collector.join(timeout=70)\n        for signum, handler in previous.items():')
          driver = root / 'icloud-diagnostic-driver.py'
          driver.write_text(source)
          compile(source, str(driver), 'exec')
          log = root / f'icloud-native-preflight-{attempt}.log'
          master, slave = pty.openpty()
          process = subprocess.Popen(['python3', '-u', str(driver), '--skip-build', '--jobs', '1', '--filter', selection], stdout=slave, stderr=slave)
          os.close(slave)
          with log.open('wb') as output:
              while True:
                  try: chunk = os.read(master, 65536)
                  except OSError as error:
                      if error.errno == errno.EIO: break
                      raise
                  if not chunk: break
                  output.write(chunk); output.flush()
                  sys.stdout.buffer.write(chunk); sys.stdout.buffer.flush()
          os.close(master)
          status = process.wait()
          text = log.read_text()
          if 'Native suite primary status=0; cleanup status=0' not in text or '*** Signal ' in text:
              status = status or 1
          print(f'ATTEMPT {attempt}: status={status}', flush=True)
          sys.exit(status)
          PYTHON
      - name: Preserve attempt and pixel evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: icloud-native-preflight-1
          path: |
            ${{ runner.temp }}/icloud-native-preflight-*.log
            ${{ runner.temp }}/icloud-gesture-stack.txt
            ${{ runner.temp }}/icloud-sampler.log
            ${{ runner.temp }}/icloud-gesture-start.json
            /tmp/vane-resize-*.png
