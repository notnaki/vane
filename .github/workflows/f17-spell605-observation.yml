name: F17 spell605 canonical boundary observation
on:
  push:
    branches: [codex/f17-spell605-boundary-audit]
permissions:
  contents: read
  actions: read
concurrency:
  group: f17-spell605-${{ github.ref }}
  cancel-in-progress: false
jobs:
  controls:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      VANE_JOB_KIND: controls
      VANE_OBSERVATION_INDEX: '0'
      VANE_RUNTIME_ARCHIVE_SHA: '477f9510a5250dc6ae499ec3395421659b78eb044f50020e28bb0420c44f9651'
      VANE_BUILD_MANIFEST_SHA: 'c77c7af65c2bfd41e5c77b6e8dbd7584a4bcc9268f22cecf7685afec04a4e357'
      SWIFT_BACKTRACE: enable=yes,interactive=no,color=no,threads=crashed,registers=none,images=none,limit=48,top=0,sanitize=yes,output-to=stderr,timeout=10s,warnings=suppressed
      VANE_DIAGNOSTIC_SOURCE_PINS: "{\".github/diagnostics/f17-spell605-slots.json\":\"2608a382d6ab7cf5358cd82580751223e30fac7eb716ca7a07159d3dbc6f7af3\",\".github/diagnostics/spell_trace_validation.py\":\"08170a4bf392be9b7d876354c10bcd0031c27d77554d4d13875134bcfcee9c78\",\".github/diagnostics/f17_spell_hosted_controller.py\":\"6181c0d2a4b5d767c7837dae2a172922f20cfc14e9ec4b03d4a98316d79fb29f\",\".github/diagnostics/f17_canonical_boundary_audit.py\":\"4c840fded5519de9685ec80641f2e472f44c87ec231f69361460d43a472343f5\"}"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set task-owned runtime and evidence paths
        run: |
          printf '%s\n' "VANE_DIAGNOSTIC_DIR=$RUNNER_TEMP/f17-spell605-$GITHUB_JOB" "VANE_RUNTIME_ARCHIVE=$RUNNER_TEMP/f17-spell605-runtime/f17-spell605-runtime.tar.gz" "VANE_BUILD_MANIFEST=$RUNNER_TEMP/f17-spell605-build/build-runtime-manifest.json" >> "$GITHUB_ENV"
      - name: Guard exact605c sources and empty private build paths
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,os,subprocess
          from pathlib import Path
          e=Path(os.environ['VANE_DIAGNOSTIC_DIR']);e.mkdir(exist_ok=False)
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();base='605caadc1f8c8df99fc833cd7dfd191c702dbd9a'
          assert head==os.environ['GITHUB_SHA'] and subprocess.check_output(['git','merge-base',base,head],text=True).strip()==base
          assert subprocess.check_output(['git','status','--porcelain'],text=True)==''
          expected={'.github/workflows/f17-spell605-observation.yml','.github/diagnostics/f17-spell605-slots.json','.github/diagnostics/spell_trace_validation.py','.github/diagnostics/f17_spell_hosted_controller.py','.github/diagnostics/f17_canonical_boundary_audit.py'}
          assert set(subprocess.check_output(['git','diff','--name-only',base,head],text=True).splitlines())==expected
          assert subprocess.check_output(['git','diff',base,head,'--','Sources','Tests','scripts','Package.swift','Package.resolved'])==b''
          for path,digest in json.loads(os.environ['VANE_DIAGNOSTIC_SOURCE_PINS']).items():assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest,path
          for path in ['.build','Vane.app','.vane-ci-build.json']:assert not Path(path).exists() and not Path(path).is_symlink()
          subprocess.run(['git','diff','--check',base,head],check=True)
          (e/'source.json').write_text(json.dumps({'head':head,'compiled_legacy_head':'8ed979de0242990c23ab955b4b866bc78e32f737','source':base,'source_tree':subprocess.check_output(['git','rev-parse',base+'^{tree}'],text=True).strip(),'source_tests_package_unchanged':True,'current_runtime_only_not_historical':True,'F17_fixed':False},indent=2)+'\n')
          (e/'source.patch').write_bytes(subprocess.check_output(['git','diff','--binary','--full-index',base,head]))
          PYCODE
      - name: Download exact shared native runtime
        uses: actions/download-artifact@v5
        with:
          artifact-ids: 13071912023
          run-id: 41277387985
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/f17-spell605-runtime
      - name: Download frozen build manifest and provenance
        uses: actions/download-artifact@v5
        with:
          artifact-ids: 13071623035
          run-id: 41277387985
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/f17-spell605-build
      - name: Restore byte-pinned current runtime with canonical compatibility guards
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,os,subprocess
          from pathlib import Path
          e=Path(os.environ['VANE_DIAGNOSTIC_DIR']);root=Path.cwd().resolve();archive=Path(os.environ['VANE_RUNTIME_ARCHIVE']);manifest=Path(os.environ['VANE_BUILD_MANIFEST']);sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          assert sha(manifest)==os.environ['VANE_BUILD_MANIFEST_SHA'];m=json.loads(manifest.read_text())
          assert m['head']=='8ed979de0242990c23ab955b4b866bc78e32f737' and m['source']=='605caadc1f8c8df99fc833cd7dfd191c702dbd9a'
          assert sha(archive)==m['archive_sha256']==os.environ['VANE_RUNTIME_ARCHIVE_SHA']
          assert m['metadata']['root']==str(root) and m['metadata']['revision']=='8ed979de0242990c23ab955b4b866bc78e32f737'
          assert not (root/'.build').exists() and not (root/'.build').is_symlink()
          with (e/'restore.log').open('wb') as log:restored=subprocess.run(['python3','scripts/ci-build-artifact.py','restore','--revision','8ed979de0242990c23ab955b4b866bc78e32f737','--archive',str(archive)],stdout=log,stderr=subprocess.STDOUT)
          assert restored.returncode==0,'Exact root/revision/live toolchain restore rejected; no execution'
          for path,digest in m['files'].items():
              live=root/path;assert live.is_file() and not live.is_symlink() and live.resolve()==live and sha(live)==digest,path
          assert not (root/'.build').is_symlink() and (root/'.build').resolve()==root/'.build'
          (e/'restored-runtime-manifest.json').write_bytes(manifest.read_bytes())
          PYCODE
      - name: Read runner and WebKit versions without loading bundles
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,os,plistlib
          from pathlib import Path
          e=Path(os.environ['VANE_DIAGNOSTIC_DIR'])
          metadata={'runner_environment':{key:os.environ.get(key) for key in ['RUNNER_OS','RUNNER_ARCH','RUNNER_NAME','ImageOS','ImageVersion']},'kernel':dict(zip(['sysname','nodename','release','version','machine'],os.uname())),'bundle_execution':False,'original_version_equivalence_asserted':False,'plists':[]}
          paths=['/System/Library/CoreServices/SystemVersion.plist','/System/Library/Frameworks/WebKit.framework/Versions/A/Resources/Info.plist','/System/Library/Frameworks/WebKit.framework/Versions/A/XPCServices/com.apple.WebKit.WebContent.xpc/Contents/Info.plist','/System/Volumes/Preboot/Cryptexes/OS/System/Library/Frameworks/WebKit.framework/Versions/A/Resources/Info.plist','/System/Volumes/Preboot/Cryptexes/OS/System/Library/Frameworks/WebKit.framework/Versions/A/XPCServices/com.apple.WebKit.WebContent.xpc/Contents/Info.plist']
          for path in paths:
              record={'requested_path':path}
              try:
                  file=Path(path);data=file.read_bytes();info=plistlib.loads(data)
                  record.update(resolved_path=str(file.resolve()),sha256=hashlib.sha256(data).hexdigest(),values={key:info.get(key) for key in ['ProductName','ProductVersion','ProductBuildVersion','CFBundleIdentifier','CFBundleVersion','CFBundleShortVersionString','BuildMachineOSBuild']})
              except (OSError,ValueError,plistlib.InvalidFileException) as error:record['unavailable']=str(error)
              metadata['plists'].append(record)
          (e/'runner-system-webkit-metadata.json').write_text(json.dumps(metadata,indent=2)+'\n')
          PYCODE
      - name: Original inventory then smoke then fixed selected host slots
        run: python3 .github/diagnostics/f17_spell_hosted_controller.py
      - name: Preserve every raw outcome trace and canonical ownership receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: f17-spell605-evidence-${{ github.job }}
          path: ${{ env.VANE_DIAGNOSTIC_DIR }}
          if-no-files-found: warn
          retention-days: 14
