name: Public prearmed parent-layout stack diagnosis
on:
  push:
    branches: [codex/public-motion-preflight-20261113]
permissions:
  contents: read
env:
  VANE_EXPERIMENT_SIDEBAR_HOST: '1'
  VANE_PROFILE_BOUNDARY_COSTS: '1'
  VANE_PROFILE_PARENT_SAMPLE: '1'
  VANE_EXPECTED_TESTS: |
    VaneTests.SpaceNativeRenderingTests/testReverseProfileSwipeTakesOverTheSamePresentedNativeRows
  VANE_CANDIDATE_SHA: ${{ github.sha }}
  VANE_DIAGNOSTIC_FILTER: '^VaneTests[.]SpaceNativeRenderingTests/testReverseProfileSwipeTakesOverTheSamePresentedNativeRows$'
jobs:
  diagnostic:
    name: Build and diagnose native fixtures
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Verify exact diagnostic source
        run: |
          set -euo pipefail
          [[ "$VANE_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$VANE_CANDIDATE_SHA"
          test -n "$VANE_DIAGNOSTIC_FILTER"

      - name: Identify Swift toolchain
        id: toolchain
        run: |
          set -euo pipefail
          swift --version
          xcodebuild -version
          KEY=$(python3 scripts/ci-build-artifact.py toolchain)
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      # Only checks builds go into this cache. Release builds compile an OAuth secret
      # into the app, so their build products must never enter a PR-readable cache.
      # PRs reuse main's cache without leaving a separate archive for every revision.
      - name: Restore Swift debug build
        id: swift-cache
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: swift-debug-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ hashFiles('Sources/**', 'Tests/**', 'scripts/ci-source-state.py', 'make-app.sh', '.github/workflows/checks.yml') }}
          restore-keys: |
            swift-debug-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
            swift-debug-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-

      # Checkout gives even unchanged inputs new mtimes. Restore only content-matching
      # timestamps for Swift, C/Objective-C bridges, headers and resources. Rebuilding
      # an unchanged bridge can invalidate all dependent Swift compilation.
      - name: Restore unchanged source timestamps
        run: python3 scripts/ci-source-state.py restore

      - name: Build app and native tests once
        run: swift build -c debug --build-tests --disable-index-store

      - name: Bundle
        env:
          VANE_CI_TOOLCHAIN_KEY: ${{ steps.toolchain.outputs.key }}
        run: ./make-app.sh debug --skip-app-build

      - name: Package shared debug runtime
        run: |
          set -euo pipefail
          BIN_PATH=$(swift build -c debug --show-bin-path)
          python3 scripts/ci-build-artifact.py pack \
            --bin-path "$BIN_PATH" --revision "$VANE_CANDIDATE_SHA" \
            --archive "$RUNNER_TEMP/vane-debug-runtime.tar.gz"

      - name: Share compiled runtime
        uses: actions/upload-artifact@v6
        with:
          name: public-debug-runtime
          path: ${{ runner.temp }}/vane-debug-runtime.tar.gz
          compression-level: 0
          overwrite: true
          retention-days: 1

      - name: Save source timestamps for the build cache
        run: python3 scripts/ci-source-state.py save

      - name: Save Swift debug build
        if: steps.swift-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .build
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}

      - name: Admit actual system motion on this disposable runner
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/vane-motion-probe.swift" <<'SWIFT'
          import AppKit
          import Foundation
          let reduced = NSWorkspace.shared.accessibilityDisplayShouldReduceMotion
          print("MOTION_ADMISSION reduceMotion=\(reduced) screens=\(NSScreen.screens.map(\.frame))")
          if CommandLine.arguments.contains("--require-motion") && reduced { exit(78) }
          SWIFT
          swiftc "$RUNNER_TEMP/vane-motion-probe.swift" -o "$RUNNER_TEMP/vane-motion-probe"
          "$RUNNER_TEMP/vane-motion-probe" | tee "$RUNNER_TEMP/vane-motion-admission.log"
          defaults write com.apple.universalaccess reduceMotion -bool false
          defaults -currentHost write com.apple.universalaccess reduceMotion -bool false
          admitted=false
          for attempt in {1..10}; do
            echo "Motion admission attempt $attempt" >> "$RUNNER_TEMP/vane-motion-admission.log"
            if "$RUNNER_TEMP/vane-motion-probe" --require-motion >> "$RUNNER_TEMP/vane-motion-admission.log"; then admitted=true; break; fi
            sleep 0.5
          done
          cat "$RUNNER_TEMP/vane-motion-admission.log"
          test "$admitted" = true
      - name: Owned AppKit loop preflight
        timeout-minutes: 4
        env:
          VANE_APPKIT_LOOP_SMOKE: '1'
          VANE_NATIVE_FIXTURE_PRIMARY_TIMEOUT: '90'
          SWIFT_BACKTRACE: enable=yes,interactive=no,color=no,threads=crashed,registers=none,images=none,limit=48,top=0,sanitize=yes,output-to=stderr,timeout=10s,warnings=suppressed
        run: |
          set -euo pipefail
          python3 scripts/run-native-tests.py --skip-build --jobs 1 --filter '^VaneTests[.]NativeApplicationLoopSmokeTests/testOwnedLoopAdmitsAsyncWorkAndStops$' 2>&1 | tee "$RUNNER_TEMP/vane-motion-smoke.log"
          grep -Fq 'AppKit loop smoke: delayedHeartbeat=true, completed=true' "$RUNNER_TEMP/vane-motion-smoke.log"
          grep -Fxq 'Native suite primary status=0; cleanup status=0' "$RUNNER_TEMP/vane-motion-smoke.log"
          if grep -Eq '^\*\*\* Signal [0-9]+: Backtracing' "$RUNNER_TEMP/vane-motion-smoke.log"; then exit 1; fi
      - name: Discover selected diagnostic methods
        run: |
          set -euo pipefail
          swift test list --skip-build > "$RUNNER_TEMP/vane-diag-inventory.txt"
          python3 - <<'PYCODE'
          import pathlib,os,re,json
          r=pathlib.Path(os.environ['RUNNER_TEMP']);pattern=re.compile(os.environ['VANE_DIAGNOSTIC_FILTER'])
          tests=[t.strip() for t in (r/'vane-diag-inventory.txt').read_text().splitlines() if t.startswith('VaneTests.') and pattern.search(t.strip())]
          expected=set(os.environ['VANE_EXPECTED_TESTS'].splitlines())
          assert set(tests)==expected and len(tests)==len(expected), f'Incorrect selected cases: expected={sorted(expected)} actual={tests}'
          (r/'vane-diag-manifest.json').write_text(json.dumps({'schema':1,'tests':tests},indent=2)+'\n')
          print('Selected diagnostic methods:',len(tests))
          PYCODE
      - name: Observe original native outcomes
        timeout-minutes: 24
        env:
          VANE_NATIVE_FIXTURE_PRIMARY_TIMEOUT: '1200'
          SWIFT_BACKTRACE: enable=yes,interactive=no,color=no,threads=crashed,registers=none,images=none,limit=48,top=0,sanitize=yes,output-to=stderr,timeout=10s,warnings=suppressed
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/prearmed-parent-stack.py" <<'OWNEDSAMPLE'
          """Diagnostic only: pre-arm one owned XCTest sample before the original landing.
          Never interrupt the native wrapper or its cleanup. No assertion/status masking.
          """
          import datetime,json,os,pathlib,re,subprocess,sys,time,threading,pty,errno,signal
          out=pathlib.Path(sys.argv[1]);out.mkdir(parents=True,exist_ok=True)
          assert not any((out/name).exists() for name in ['request.json','armed.json','native.log','main-thread.sample','diagnostic-status.json','profile.cost.content.layout.begin.json','profile.cost.content.layout.end.json']), 'Requires a fresh owned diagnostic directory'
          assert sys.argv[2]=='--' and len(sys.argv)>3
          cwd=pathlib.Path.cwd().resolve();build=str(cwd/'.build')+'/'
          record={'diagnostic_only':True,'command':sys.argv[3:],'started':datetime.datetime.now(datetime.timezone.utc).isoformat(),'prearm_transport':'PTY; sampler held beforeland, nonblocking content-layout-begin marker resumes only sampler','duration_seconds':1,'sampling_interval_ms':1,'analysis_scope':'Main Thread only; sample tool collects full process'}
          sampler=None;reader=None;sample_started=None;sample_status=None
          
          def atomic_json(path,value):
           tmp=path.with_suffix('.tmp');tmp.write_text(json.dumps(value,indent=2)+'\n');tmp.replace(path)
          
          def read_sample_output(process,target,output):
           try:
            with (out/'sample.log').open('w') as stream:
             for line in output:
              stream.write(line);stream.flush()
              if line.startswith('Sampling process ') and not record.get('armed'):
               # Revalidate exact start+command and our still-live sampler before lifting the prerequisite.
               actual=subprocess.check_output(['ps','-p',str(target['pid']),'-o','lstart=,command='],text=True).strip()
               assert actual.startswith(target['start']) and actual.endswith(target['command'])
               assert process.poll() is None
               process.send_signal(signal.SIGSTOP)
               stopped=False
               stop_deadline=time.monotonic()+1
               while time.monotonic()<stop_deadline and process.poll()is None:
                if 'T'in subprocess.check_output(['ps','-p',str(process.pid),'-o','stat='],text=True):stopped=True;break
                time.sleep(.002)
               assert stopped, 'Owned sampler did not stop before arming'
               record['armed']={'pid':target['pid'],'armed':True,'epoch':time.time(),'monotonic':time.monotonic(),'sampler_pid':process.pid}
               atomic_json(out/'armed.json',record['armed'])
           except OSError as error:
            if error.errno != errno.EIO:record['sample_reader_error']=type(error).__name__+': '+str(error)
           except Exception as error:record['sample_reader_error']=type(error).__name__+': '+str(error)
           finally:output.close()
          
          with (out/'native.log').open('w') as native:
           primary=subprocess.Popen(sys.argv[3:],stdout=native,stderr=subprocess.STDOUT)
           while primary.poll() is None:
            request_path=out/'request.json'
            if sampler is None and request_path.exists() and not record.get('watch_error'):
             try:
              request=json.loads(request_path.read_text());pid=request['pid'];assert isinstance(pid,int) and pid>1
              rows=[]
              for line in subprocess.check_output(['ps','-axo','pid=,ppid=,lstart=,command='],text=True).splitlines():
               m=re.match(r'\s*(\d+)\s+(\d+)\s+(\S+\s+\S+\s+\d+\s+\S+\s+\d+)\s+(.*)',line)
               if m:rows.append((int(m[1]),int(m[2]),m[3],m[4]))
              owned={primary.pid}
              for _ in range(12):
               for child,parent,start,command in rows:
                if parent in owned:owned.add(child)
              matches=[(p,start,cmd)for p,parent,start,cmd in rows if p==pid and p in owned and cmd.startswith('/Applications/Xcode') and '/xctest 'in cmd and build in cmd and 'testReverseProfileSwipeTakesOverTheSamePresentedNativeRows'in cmd]
              assert len(matches)==1,matches
              pid,start,command=matches[0]
              actual=subprocess.check_output(['ps','-p',str(pid),'-o','lstart=,command='],text=True).strip()
              assert actual.startswith(start) and actual.endswith(command)
              target={'pid':pid,'start':start,'command':command};record['sample_host']=target;record['request']=request
              master,slave=pty.openpty()
              sampler=subprocess.Popen(['/usr/bin/sample',str(pid),'1','1','-file',str(out/'main-thread.sample')],stdout=slave,stderr=slave)
              os.close(slave);sample_output=os.fdopen(master,'r',encoding='utf-8',errors='replace')
              sample_started=time.monotonic();record['sample_pid']=sampler.pid
              reader=threading.Thread(target=read_sample_output,args=(sampler,target,sample_output));reader.start()
             except Exception as error:record['watch_error']=type(error).__name__+': '+str(error)
            phase=out/'profile.cost.content.layout.begin.json'
            if sampler is not None and record.get('armed') and not record.get('resumed') and phase.exists():
             try:
              assert sampler.poll()is None, 'Sampler exited before measured phase'
              record['phase_begin']=json.loads(phase.read_text())
              record['resumed']={'epoch':time.time(),'monotonic':time.monotonic()}
              sampler.send_signal(signal.SIGCONT)
             except Exception as error:record['watch_error']=type(error).__name__+': '+str(error)
            if sampler is not None and sampler.poll() is None and time.monotonic()-sample_started>30:
             sampler.send_signal(signal.SIGCONT);sampler.terminate()
             try:sampler.wait(timeout=5)
             except subprocess.TimeoutExpired:sampler.kill();sampler.wait()
             record['sample_timeout']=True
            time.sleep(.002)
           primary_status=primary.wait()
          if sampler is not None:
           try:sample_status=sampler.wait(timeout=5)
           except subprocess.TimeoutExpired:
            sampler.send_signal(signal.SIGCONT);sampler.terminate()
            try:sample_status=sampler.wait(timeout=5)
            except subprocess.TimeoutExpired:sampler.kill();sample_status=sampler.wait()
            record['sample_timeout']=True
           if reader:reader.join(timeout=5)
          record.update(primary_status=primary_status,sample_status=sample_status,sample_exists=(out/'main-thread.sample').exists(),finished=datetime.datetime.now(datetime.timezone.utc).isoformat())
          if record['sample_exists']:
           text=(out/'main-thread.sample').read_text(errors='replace');lines=text.splitlines();main=[];inside=False
           for line in lines:
            if re.search(r'^\s+\d+ Thread_\d+.*(?:Main Thread|com[.]apple[.]main-thread)',line):inside=True
            elif inside and re.search(r'^\s+\d+ Thread_\d+',line):break
            if inside:main.append(line)
           (out/'main-thread-only.txt').write_text('\n'.join(main)+'\n');record['main_thread_lines']=len(main)
          atomic_json(out/'diagnostic-status.json',record);print(json.dumps(record))
          diagnostic_ok=sample_status==0 and record['sample_exists'] and bool(record.get('armed')) and bool(record.get('resumed')) and not any(record.get(k)for k in ['watch_error','sample_reader_error','sample_timeout']) and record.get('main_thread_lines',0)>0
          sys.exit(primary_status or (0 if diagnostic_ok else 1))
          OWNEDSAMPLE
          set +e
          python3 "$RUNNER_TEMP/prearmed-parent-stack.py" "$RUNNER_TEMP/profile-parent-stack" -- python3 scripts/run-native-tests.py --skip-build --jobs 1 --filter "$VANE_DIAGNOSTIC_FILTER"
          native_diagnostic_status=$?
          set -e
          cp "$RUNNER_TEMP/profile-parent-stack/native.log" "$RUNNER_TEMP/vane-diag-tests.log"
          cat "$RUNNER_TEMP/vane-diag-tests.log"
          exit "$native_diagnostic_status"
      - name: Verify completed selection when successful
        run: |
          set -euo pipefail
          python3 scripts/native-test-shards.py verify --manifest "$RUNNER_TEMP/vane-diag-manifest.json" --log "$RUNNER_TEMP/vane-diag-tests.log"
          python3 - <<'PASSGUARD'
          import json, pathlib, os, re
          r=pathlib.Path(os.environ['RUNNER_TEMP'])
          expected=set(os.environ['VANE_EXPECTED_TESTS'].splitlines())
          manifest=json.loads((r/'vane-diag-manifest.json').read_text())['tests']
          assert set(manifest)==expected and len(manifest)==len(expected)
          outcomes={t:[] for t in expected}
          for cls,method,status in re.findall(r"Test Case '-\[VaneTests\.(\w+) (\w+)\]' (passed|failed|skipped)", (r/'vane-diag-tests.log').read_text()):
              key=f'VaneTests.{cls}/{method}'
              if key in outcomes: outcomes[key].append(status)
          assert all(v==['passed'] for v in outcomes.values()), f'Every selected case must pass once: {outcomes}'
          print('All exact preflight cases passed once; no skips.')
          PASSGUARD
          grep -Fxq 'Native suite primary status=0; cleanup status=0' "$RUNNER_TEMP/vane-diag-tests.log"
          if grep -Eq '^\*\*\* Signal [0-9]+: Backtracing' "$RUNNER_TEMP/vane-diag-tests.log"; then exit 1; fi
      - name: Retain diagnostic evidence including failed attempts
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: public-native-logs
          path: |
            ${{ runner.temp }}/vane-diag-tests.log
            ${{ runner.temp }}/profile-boundary-costs
            ${{ runner.temp }}/profile-parent-stack
            ${{ runner.temp }}/vane-diag-manifest.json
            ${{ runner.temp }}/vane-diag-inventory.txt
            ${{ runner.temp }}/vane-motion-admission.log
            ${{ runner.temp }}/vane-motion-smoke.log
          if-no-files-found: ignore
          retention-days: 7
