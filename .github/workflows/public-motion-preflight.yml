    VaneTests.TabClosePublicationTests/testRetiredParkedTabCannotResumeFromALateCallback
    VaneTests.ThemeWashSurfaceTests/testBrowserFloatingSidebarSharesTheWindowWash
    VaneTests.ThemeWashSurfaceTests/testFloatingCopyKeepsTheWindowWashAndNativeTransitions
    VaneTests.ThemeWashSurfaceTests/testFloatingGradientSamplesTheWindowInsteadOfRestartingInsideThePanel
    VaneTests.ThemeWashSurfaceTests/testInterruptedOrdinaryGrainCompletionCannotHideNewOwnersVisibleFade
    VaneTests.ThemeWashSurfaceTests/testInvisibleGrainDoesNotRasterizeDuringResizeAndFadesRemainVisible
    VaneTests.ThemeWashSurfaceTests/testOrdinaryGrainFadeHidesSettledSourceAndCopies
    VaneTests.ThemeWashSurfaceTests/testRepeatedDestinationDoesNotInterruptColourBlend
    VaneTests.ThemeWashSurfaceTests/testReplacingSourceWithSameDestinationClearsThePreviousSourcesAnimation
  VANE_CANDIDATE_SHA: ${{ github.sha }}
  VANE_DIAGNOSTIC_FILTER: '^VaneTests[.](SpaceNativeRenderingTests|LibrarySwipeTests|EdgeSidebarScrollContinuityTests|PageResizeStyleTests|NativeContentBoundaryTests|ThemeWashSurfaceTests|SpaceColourTransitionTests|SidebarObservationTests|TabClosePublicationTests|SidebarHousekeepingTests|SpaceSwitchPerformanceTests|SpaceCreationSwipeRenderingTests|SidebarNativeReadinessTests|OffscreenNativeSidebarReadinessTests|NativeSidebarStableOwnershipTests|SidebarRowRetentionTests|LiveSidebarResponsivenessTests|BoundedSidebarMountingTests)/'
jobs:
  diagnostic:
    name: Build and diagnose native fixtures
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Verify exact diagnostic source
        run: |
          set -euo pipefail
          [[ "$VANE_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$VANE_CANDIDATE_SHA"
          test -n "$VANE_DIAGNOSTIC_FILTER"

      - name: Identify Swift toolchain
        id: toolchain
        run: |
          set -euo pipefail
          swift --version
          xcodebuild -version
          KEY=$(python3 scripts/ci-build-artifact.py toolchain)
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      # Only checks builds go into this cache. Release builds compile an OAuth secret
      # into the app, so their build products must never enter a PR-readable cache.
      # PRs reuse main's cache without leaving a separate archive for every revision.
      - name: Restore Swift debug build
        id: swift-cache
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: swift-debug-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ hashFiles('Sources/**', 'Tests/**', 'scripts/ci-source-state.py', 'make-app.sh', '.github/workflows/checks.yml') }}
          restore-keys: |
            swift-debug-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
            swift-debug-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-

      # Checkout gives even unchanged inputs new mtimes. Restore only content-matching
      # timestamps for Swift, C/Objective-C bridges, headers and resources. Rebuilding
      # an unchanged bridge can invalidate all dependent Swift compilation.
      - name: Restore unchanged source timestamps
        run: python3 scripts/ci-source-state.py restore

      - name: Build app and native tests once
        run: swift build -c debug --build-tests --disable-index-store

      - name: Bundle
        env:
          VANE_CI_TOOLCHAIN_KEY: ${{ steps.toolchain.outputs.key }}
        run: ./make-app.sh debug --skip-app-build

      - name: Package shared debug runtime
        run: |
          set -euo pipefail
          BIN_PATH=$(swift build -c debug --show-bin-path)
          python3 scripts/ci-build-artifact.py pack \
            --bin-path "$BIN_PATH" --revision "$VANE_CANDIDATE_SHA" \
            --archive "$RUNNER_TEMP/vane-debug-runtime.tar.gz"

      - name: Share compiled runtime
        uses: actions/upload-artifact@v6
        with:
          name: public-debug-runtime
          path: ${{ runner.temp }}/vane-debug-runtime.tar.gz
          compression-level: 0
          overwrite: true
          retention-days: 1

      - name: Save source timestamps for the build cache
        run: python3 scripts/ci-source-state.py save

      - name: Save Swift debug build
        if: steps.swift-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .build
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}

      - name: Admit actual system motion on this disposable runner
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/vane-motion-probe.swift" <<'SWIFT'
          import AppKit
          import Foundation
          let reduced = NSWorkspace.shared.accessibilityDisplayShouldReduceMotion
          print("MOTION_ADMISSION reduceMotion=\(reduced) screens=\(NSScreen.screens.map(\.frame))")
          if CommandLine.arguments.contains("--require-motion") && reduced { exit(78) }
          SWIFT
          swiftc "$RUNNER_TEMP/vane-motion-probe.swift" -o "$RUNNER_TEMP/vane-motion-probe"
          "$RUNNER_TEMP/vane-motion-probe" | tee "$RUNNER_TEMP/vane-motion-admission.log"
          defaults write com.apple.universalaccess reduceMotion -bool false
          defaults -currentHost write com.apple.universalaccess reduceMotion -bool false
          admitted=false
          for attempt in {1..10}; do
            echo "Motion admission attempt $attempt" >> "$RUNNER_TEMP/vane-motion-admission.log"
            if "$RUNNER_TEMP/vane-motion-probe" --require-motion >> "$RUNNER_TEMP/vane-motion-admission.log"; then admitted=true; break; fi
            sleep 0.5
          done
          cat "$RUNNER_TEMP/vane-motion-admission.log"
          test "$admitted" = true
      - name: Owned AppKit loop preflight
        timeout-minutes: 4
        env:
          VANE_APPKIT_LOOP_SMOKE: '1'
          VANE_NATIVE_FIXTURE_PRIMARY_TIMEOUT: '90'
          SWIFT_BACKTRACE: enable=yes,interactive=no,color=no,threads=crashed,registers=none,images=none,limit=48,top=0,sanitize=yes,output-to=stderr,timeout=10s,warnings=suppressed
        run: |
          set -euo pipefail
          python3 scripts/run-native-tests.py --skip-build --jobs 1 --filter '^VaneTests[.]NativeApplicationLoopSmokeTests/testOwnedLoopAdmitsAsyncWorkAndStops$' 2>&1 | tee "$RUNNER_TEMP/vane-motion-smoke.log"
          grep -Fq 'AppKit loop smoke: delayedHeartbeat=true, completed=true' "$RUNNER_TEMP/vane-motion-smoke.log"
          grep -Fxq 'Native suite primary status=0; cleanup status=0' "$RUNNER_TEMP/vane-motion-smoke.log"
          if grep -Eq '^\*\*\* Signal [0-9]+: Backtracing' "$RUNNER_TEMP/vane-motion-smoke.log"; then exit 1; fi
      - name: Discover selected diagnostic methods
        run: |
          set -euo pipefail
          swift test list --skip-build > "$RUNNER_TEMP/vane-diag-inventory.txt"
          python3 - <<'PYCODE'
          import pathlib,os,re,json
          r=pathlib.Path(os.environ['RUNNER_TEMP']);pattern=re.compile(os.environ['VANE_DIAGNOSTIC_FILTER'])
          tests=[t.strip() for t in (r/'vane-diag-inventory.txt').read_text().splitlines() if t.startswith('VaneTests.') and pattern.search(t.strip())]
          expected=set(os.environ['VANE_EXPECTED_TESTS'].splitlines())
          assert set(tests)==expected and len(tests)==len(expected), f'Incorrect selected cases: expected={sorted(expected)} actual={tests}'
          (r/'vane-diag-manifest.json').write_text(json.dumps({'schema':1,'tests':tests},indent=2)+'\n')
          print('Selected diagnostic methods:',len(tests))
          PYCODE
      - name: Observe original native outcomes
        timeout-minutes: 24
        env:
          VANE_NATIVE_FIXTURE_PRIMARY_TIMEOUT: '1200'
          SWIFT_BACKTRACE: enable=yes,interactive=no,color=no,threads=crashed,registers=none,images=none,limit=48,top=0,sanitize=yes,output-to=stderr,timeout=10s,warnings=suppressed
        run: |
          set -euo pipefail
          python3 scripts/run-native-tests.py --skip-build --jobs 1 --filter "$VANE_DIAGNOSTIC_FILTER" 2>&1 | tee "$RUNNER_TEMP/vane-diag-tests.log"
      - name: Verify completed selection when successful
        run: |
          set -euo pipefail
          python3 scripts/native-test-shards.py verify --manifest "$RUNNER_TEMP/vane-diag-manifest.json" --log "$RUNNER_TEMP/vane-diag-tests.log"
          python3 - <<'PASSGUARD'
          import json, pathlib, os, re
          r=pathlib.Path(os.environ['RUNNER_TEMP'])
          expected=set(os.environ['VANE_EXPECTED_TESTS'].splitlines())
          manifest=json.loads((r/'vane-diag-manifest.json').read_text())['tests']
          assert set(manifest)==expected and len(manifest)==len(expected)
          outcomes={t:[] for t in expected}
          for cls,method,status in re.findall(r"Test Case '-\[VaneTests\.(\w+) (\w+)\]' (passed|failed|skipped)", (r/'vane-diag-tests.log').read_text()):
              key=f'VaneTests.{cls}/{method}'
              if key in outcomes: outcomes[key].append(status)
          assert all(v==['passed'] for v in outcomes.values()), f'Every selected case must pass once: {outcomes}'
          print('All exact preflight cases passed once; no skips.')
          PASSGUARD
          grep -Fxq 'Native suite primary status=0; cleanup status=0' "$RUNNER_TEMP/vane-diag-tests.log"
          if grep -Eq '^\*\*\* Signal [0-9]+: Backtracing' "$RUNNER_TEMP/vane-diag-tests.log"; then exit 1; fi
      - name: Retain diagnostic evidence including failed attempts
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: public-native-logs
          path: |
            ${{ runner.temp }}/vane-diag-tests.log
            ${{ runner.temp }}/vane-diag-manifest.json
            ${{ runner.temp }}/vane-diag-inventory.txt
            ${{ runner.temp }}/vane-motion-admission.log
            ${{ runner.temp }}/vane-motion-smoke.log
          if-no-files-found: ignore
          retention-days: 7
