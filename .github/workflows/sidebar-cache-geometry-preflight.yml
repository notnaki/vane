name: Repaired original sidebar cohort preflight
on:
  push:
    branches: [codex/sidebar-repaired-original19-preflight]
permissions:
  contents: read
concurrency:
  group: sidebar-cache-geometry-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused-native:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      VANE_PINNED_PRODUCT: b2c755ba91faf96337eb4419d6369d964f7eab0a
      VANE_DIAGNOSTIC_TEST_SHA: 481351f5ecc50f824c6033fa470b5c686b2123c8b5528150c770ef42d39314c8
      VANE_PINNED_INVENTORY_SHA: e1c97a48bae695c99a2bbef36121f94586a7b36c110c54e28366d8128d00010a
      SWIFT_BACKTRACE: enable=yes,interactive=no,color=no,threads=crashed,registers=none,images=none,limit=48,top=0,sanitize=yes,output-to=stderr,timeout=10s,warnings=suppressed
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set diagnostic evidence directory
        run: echo "VANE_DIAGNOSTIC_DIR=$RUNNER_TEMP/vane-sidebar-cache-geometry" >> "$GITHUB_ENV"
      - name: Verify pinned product and exact diagnostic source
        run: |
          mkdir -p "$VANE_DIAGNOSTIC_DIR"
          python3 - <<'PYCODE'
          import hashlib, json, os, subprocess
          from pathlib import Path
          evidence = Path(os.environ['VANE_DIAGNOSTIC_DIR'])
          product = os.environ['VANE_PINNED_PRODUCT']
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert head == os.environ['GITHUB_SHA']
          assert subprocess.check_output(['git', 'merge-base', product, head], text=True).strip() == product
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', product, head], text=True).splitlines())
          assert changed == {'Tests/VaneTests/SidebarVisibilityTests.swift', '.github/workflows/sidebar-cache-geometry-preflight.yml'}, changed
          test_file = Path('Tests/VaneTests/SidebarVisibilityTests.swift')
          assert hashlib.sha256(test_file.read_bytes()).hexdigest() == os.environ['VANE_DIAGNOSTIC_TEST_SHA']
          assert 'testInitialCachedProfileAdmissionWaitsForNativeVisibility' not in test_file.read_text()
          subprocess.run(['git', 'diff', '--check', product, head], check=True)
          source = {'product_head': product, 'diagnostic_head': head, 'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(), 'test_file_sha256': os.environ['VANE_DIAGNOSTIC_TEST_SHA'], 'native_revision_receipt_available': False}
          (evidence / 'source.json').write_text(json.dumps(source, indent=2) + '\n')
          (evidence / 'diagnostic.patch').write_bytes(subprocess.check_output(['git', 'diff', '--binary', '--full-index', product, head]))
          PYCODE
      - name: Identify Swift toolchain
        id: toolchain
        run: |
          VANE_TOOLCHAIN_KEY=$(python3 scripts/ci-build-artifact.py toolchain)
          echo "key=$VANE_TOOLCHAIN_KEY" >> "$GITHUB_OUTPUT"
      - name: Restore Swift debug build
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: swift-debug-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ hashFiles('Sources/**/*.swift') }}
          restore-keys: |
            swift-debug-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - name: Build native tests once
        run: |
          set -euo pipefail
          python3 scripts/ci-source-state.py restore
          swift build --build-system native -c debug --build-tests 2>&1 | tee "$VANE_DIAGNOSTIC_DIR/build.log"
          VANE_PREFLIGHT_BIN=$(swift build --build-system native -c debug --show-bin-path)
          echo "VANE_PREFLIGHT_BIN=$VANE_PREFLIGHT_BIN" >> "$GITHUB_ENV"
      - name: Preserve actual native runtime before any bundle execution
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, shutil, tarfile
          from pathlib import Path
          evidence = Path(os.environ['VANE_DIAGNOSTIC_DIR'])
          bin_root = Path(os.environ['VANE_PREFLIGHT_BIN']).resolve()
          description = bin_root / 'description.json'
          products = json.loads(description.read_text())['builtTestProducts']
          assert len(products) == 1, products
          binary = Path(products[0]['binaryPath'])
          assert binary.is_absolute(), binary
          binary = binary.resolve()
          bundle = next((parent for parent in binary.parents if parent.suffix == '.xctest'), None)
          assert bundle is not None and bundle.is_relative_to(bin_root), binary
          assert binary.is_file() and os.access(binary, os.X_OK), binary
          executables = [path.resolve() for path in (bundle / 'Contents/MacOS').iterdir() if path.is_file() and not path.is_symlink() and os.access(path, os.X_OK)]
          assert executables == [binary], executables
          snapshot = evidence / 'runtime-products'
          snapshot.mkdir(exist_ok=False)
          components = [bundle, bin_root / 'vane', bin_root / 'NativeLeaseHolder', description, *sorted(bin_root.glob('*.bundle'))]
          sha = lambda path: hashlib.sha256(Path(path).read_bytes()).hexdigest()
          files = []
          for live in components:
              assert live.exists() and live.resolve().is_relative_to(bin_root), live
              saved = snapshot / live.name
              if live.is_dir():
                  shutil.copytree(live, saved, symlinks=True)
                  entries = sorted(live.rglob('*'))
              else:
                  shutil.copy2(live, saved)
                  entries = [live]
              for path in entries:
                  relative = path.relative_to(live) if live.is_dir() else None
                  preserved = saved / relative if relative is not None else saved
                  if path.is_symlink():
                      assert preserved.is_symlink() and os.readlink(path) == os.readlink(preserved)
                      files.append({'live': str(path), 'preserved': str(preserved), 'symlink': os.readlink(path)})
                  elif path.is_file():
                      assert sha(path) == sha(preserved)
                      files.append({'live': str(path), 'preserved': str(preserved), 'sha256': sha(path)})
          archive = evidence / 'runtime-products.tar.gz'
          with tarfile.open(archive, 'x:gz', compresslevel=1) as handle:
              handle.add(snapshot, arcname='runtime-products')
          manifest = {'binary': str(binary), 'binary_sha256': sha(binary), 'build_description': str(description), 'build_description_sha256': sha(description), 'files': files, 'archive': str(archive), 'archive_sha256': sha(archive)}
          (evidence / 'native-runtime.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PYCODE
      - name: Owned AppKit loop smoke
        env:
          VANE_APPKIT_LOOP_SMOKE: '1'
          VANE_NATIVE_FIXTURE_PRIMARY_TIMEOUT: '90'
        run: |
          set -euo pipefail
          python3 scripts/run-native-tests.py --build-system native --skip-build --jobs 1 --filter '^VaneTests[.]NativeApplicationLoopSmokeTests/testOwnedLoopAdmitsAsyncWorkAndStops$' 2>&1 | tee "$VANE_DIAGNOSTIC_DIR/smoke.log"
          grep -Fq 'AppKit loop smoke: delayedHeartbeat=true, completed=true' "$VANE_DIAGNOSTIC_DIR/smoke.log"
          grep -Fq 'Native suite primary status=0; cleanup status=0' "$VANE_DIAGNOSTIC_DIR/smoke.log"
          if grep -Eq '^\*\*\* Signal [0-9]+: Backtracing' "$VANE_DIAGNOSTIC_DIR/smoke.log"; then exit 1; fi
      - name: Freeze discovered inventory and compiled diagnostic binary
        run: |
          set -euo pipefail
          swift test --build-system native list --skip-build > "$VANE_DIAGNOSTIC_DIR/inventory.raw.txt" 2> "$VANE_DIAGNOSTIC_DIR/inventory.stderr.txt"
          python3 - <<'PYCODE'
          import hashlib, json, os, re
          from pathlib import Path
          evidence = Path(os.environ['VANE_DIAGNOSTIC_DIR'])
          raw = evidence / 'inventory.raw.txt'
          inventory = [x.strip() for x in raw.read_text().splitlines() if x.strip() and x.strip() != 'Native test host bootstrap: beforeAppKit=true, configured=true']
          assert len(inventory) == 2345
          assert len(inventory) == len(set(inventory))
          assert all(re.fullmatch(r'[A-Za-z_]\w*(?:\.[A-Za-z_]\w*)+/[^\s/]+', x) for x in inventory)
          canonical = '\n'.join(sorted(inventory))
          assert hashlib.sha256(canonical.encode()).hexdigest() == os.environ['VANE_PINNED_INVENTORY_SHA']
          tests = ['VaneTests.SidebarObservationTests/testLiveOnlyPresentationChangesDoNotInvalidateCapturedSidebars', 'VaneTests.SidebarObservationTests/testMountedSidebarSkipsSearchUpdatesButRendersRenameChanges', 'VaneTests.SidebarObservationTests/testOutlineSelectionRenameAndProtectionStillInvalidateRowsSynchronously', 'VaneTests.SidebarObservationTests/testSearchAndChromeChangesDoNotInvalidateEverySidebarRow', 'VaneTests.SidebarObservationTests/testSnapshotChangesRevokeBeforeOutlineAssignmentAndIncludeProtection', 'VaneTests.SidebarRowRetentionTests/testSmallSidebarKeepsControlsThroughFolderToggleAndScroll', 'VaneTests.SidebarScrollCutoffTests/testElasticScrollingDoesNotInventContentBeyondTheEnds', 'VaneTests.SidebarScrollCutoffTests/testFittingAndEmptyListsHaveNoLines', 'VaneTests.SidebarScrollCutoffTests/testOnlyEdgesWithMoreContentShowLines', 'VaneTests.SidebarScrollCutoffTests/testRemovingRowsOrGrowingViewportClearsBottomLine', 'VaneTests.SidebarVisibilityTests/testCollapsingDockedSidebarDoesNotAcquireFloatingInsets', 'VaneTests.SidebarVisibilityTests/testDockingOrHidingEndsTheFloatingRevealImmediately', 'VaneTests.SidebarVisibilityTests/testFloatingRevealRetainsTheLaidOutSidebar', 'VaneTests.SidebarVisibilityTests/testHidingSidebarDisablesItsFocusedRenameField', 'VaneTests.SidebarVisibilityTests/testPresentationSamplingExcludesParkedProfileTrees', 'VaneTests.SidebarVisibilityTests/testReturningToCachedProfileDoesNotReplaySidebarDocking', 'VaneTests.SidebarVisibilityTests/testSlidingRowsReachTheWindowEdge', 'VaneTests.SidebarVisibilityTests/testVisibilityFollowsWindowAcrossNewAndParkedProfiles', 'VaneTests.SidebarVisibilityTests/testVisibilitySurvivesSpaceSwitchesWithinOneProfile']
          classes = {case.split('/', 1)[0] for case in tests}
          assert classes == {'VaneTests.SidebarObservationTests', 'VaneTests.SidebarRowRetentionTests', 'VaneTests.SidebarScrollCutoffTests', 'VaneTests.SidebarVisibilityTests'}
          assert sorted(x for x in inventory if x.split('/', 1)[0] in classes) == tests
          pattern = '^(?:' + '|'.join(re.escape(x) for x in tests) + ')$'
          assert sorted(x for x in inventory if re.search(pattern, x)) == tests
          runtime_path = evidence / 'native-runtime.json'
          runtime = json.loads(runtime_path.read_text())
          binary = Path(runtime['binary'])
          description = Path(runtime['build_description'])
          fixture = Path('Tests/VaneTests/SidebarVisibilityTests.swift')
          sha = lambda path: hashlib.sha256(Path(path).read_bytes()).hexdigest()
          assert sha(fixture) == os.environ['VANE_DIAGNOSTIC_TEST_SHA']
          assert sha(binary) == runtime['binary_sha256']
          assert sha(description) == runtime['build_description_sha256']
          (evidence / 'inventory.canonical.txt').write_text(canonical)
          (evidence / 'selected.filter').write_text(pattern + '\n')
          manifest = {'schema': 1, 'tests': tests, 'filter': pattern, 'inventory_raw_sha256': sha(raw), 'inventory_canonical_sha256': hashlib.sha256(canonical.encode()).hexdigest(), 'binary': str(binary), 'binary_sha256': sha(binary), 'build_description': str(description), 'build_description_sha256': sha(description), 'fixture': str(fixture), 'fixture_sha256': sha(fixture), 'native_revision_receipt_available': False, 'attempts': 3, 'runtime': str(runtime_path), 'runtime_sha256': sha(runtime_path)}
          (evidence / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PYCODE
      - name: Validate three predetermined repaired original19 attempts
        env:
          VANE_NATIVE_FIXTURE_PRIMARY_TIMEOUT: '180'
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, re, subprocess, sys
          from pathlib import Path
          evidence = Path(os.environ['VANE_DIAGNOSTIC_DIR'])
          manifest = json.loads((evidence / 'manifest.json').read_text())
          tests = manifest['tests']
          target = 'VaneTests.SidebarVisibilityTests/testReturningToCachedProfileDoesNotReplaySidebarDocking'
          retirement = 'VaneTests.NativeFixtureRetirementTests/testRetireManifest'
          sha = lambda path: hashlib.sha256(Path(path).read_bytes()).hexdigest()
          results = []
          for attempt in (1, 2, 3):
              log = evidence / f'attempt-{attempt}.log'
              assert not log.exists()
              assert sha(manifest['binary']) == manifest['binary_sha256']
              assert sha(manifest['fixture']) == manifest['fixture_sha256']
              runtime = json.loads(Path(manifest['runtime']).read_text())
              assert sha(manifest['runtime']) == manifest['runtime_sha256']
              def runtime_inputs_match():
                  if sha(runtime['archive']) != runtime['archive_sha256'] or sha(manifest['build_description']) != manifest['build_description_sha256']:
                      return False
                  for item in runtime['files']:
                      for key in ('live', 'preserved'):
                          path = Path(item[key])
                          if 'symlink' in item:
                              if not path.is_symlink() or os.readlink(path) != item['symlink']:
                                  return False
                          elif sha(path) != item['sha256']:
                              return False
                  return True
              def runtime_unchanged():
                  try:
                      return runtime_inputs_match()
                  except (OSError, ValueError):
                      return False
              assert runtime_unchanged()
              with log.open('xb') as handle:
                  run = subprocess.run(['python3', 'scripts/run-native-tests.py', '--build-system', 'native', '--skip-build', '--jobs', '1', '--filter', manifest['filter']], stdout=handle, stderr=subprocess.STDOUT, check=False)
              text = log.read_text(errors='replace')
              starts = re.findall(r"Test Case '-\[([^ ]+) ([^ ]+)\]' started\.", text)
              finished = re.findall(r"Test Case '-\[([^ ]+) ([^ ]+)\]' (passed|failed|skipped) \(", text)
              started = [a + '/' + b for a, b in starts]
              outcomes = {}
              for a, b, outcome in finished:
                  outcomes.setdefault(a + '/' + b, []).append(outcome)
              summary = re.findall(r'Native suite primary status=(-?\d+); cleanup status=(-?\d+)', text)
              primary, cleanup = map(int, summary[0]) if len(summary) == 1 else (-999, -999)
              errors = []
              for case in tests:
                  if started.count(case) != 1 or len(outcomes.get(case, [])) != 1:
                      errors.append('missing/duplicate case ' + case)
                  elif outcomes[case] != ['passed']:
                      errors.append('unexpected outcome ' + case)
              if any(case not in set(tests) | {retirement} for case in started):
                  errors.append('unselected case executed')
              selected_started = [case for case in started if case in tests]
              selected_finished = [a + '/' + b for a, b, _ in finished if a + '/' + b in tests]
              if selected_started != tests or selected_finished != tests:
                  errors.append('selected case execution/completion order changed')
              if started != tests + [retirement] or [a + '/' + b for a, b, _ in finished] != tests + [retirement]:
                  errors.append('full case start/completion list differs from19 plus fresh retirement')
              failed = any(outcomes.get(case) == ['failed'] for case in tests)
              target_errors = [line for line in text.splitlines() if ' error: ' in line and '-[VaneTests.SidebarVisibilityTests testReturningToCachedProfileDoesNotReplaySidebarDocking]' in line]
              original_messages = ('The arriving profile must already use docked geometry', 'An old floating inset must not animate after switching profiles')
              original_geometry_failure = outcomes.get(target) == ['failed'] and bool(target_errors) and all(any(message in line for message in original_messages) for line in target_errors)
              if outcomes.get(target) == ['failed']:
                  errors.append('target failed; stop even when the original geometry assertions failed')
              trace = [line for line in text.splitlines() if line.startswith('SIDEBAR_CACHE_GEOMETRY ')]
              if outcomes.get(target) == ['passed'] or original_geometry_failure:
                  expected_stages = ['initial-rest', 'target-floating-rest', 'source-floating-rest', 'source-docking-started', 'target-before-return', 'early-30ms', 'settled-350ms']
                  observed_stages = [re.search(r'stage=([^ ]+)', line).group(1) for line in trace]
                  if observed_stages != expected_stages or text.count('nativeRevisionReceipt=unavailable') != len(expected_stages):
                      errors.append('diagnostic trace missing/duplicated or revision receipt misrepresented')
                  if any('captured=Optional(' not in line for line in trace if 'stage=early-30ms ' in line or 'stage=settled-350ms ' in line):
                      errors.append('actual early/settled captured values missing')
              if len(summary) != 1 or cleanup != 0 or outcomes.get(retirement) != ['passed']:
                  errors.append('cleanup unverified')
              if primary != 0 or run.returncode != 0:
                  errors.append('driver exit/status mismatch')
              if re.search(r'\*\*\* Signal|Fatal error:|fatal signal|UNVERIFIED native fixture retirement|timeout|timed out', text, re.I):
                  errors.append('fatal signal/timeout/infrastructure failure')
              if sha(manifest['binary']) != manifest['binary_sha256'] or sha(manifest['fixture']) != manifest['fixture_sha256'] or not runtime_unchanged():
                  errors.append('frozen input changed')
              assertions = [line for line in text.splitlines() if re.search(r'error: -\[', line)]
              if assertions:
                  errors.append('native assertion records present')
              if 'SIDEBAR_CACHE_OWNER_CONTROL' in text:
                  errors.append('temporary control executed')
              context = [line for line in text.splitlines() if line.startswith('SIDEBAR_CACHE_OWNER_CONTEXT phase=before-initial-admission ')]
              if len(context) != 1:
                  errors.append('initial frame/screen/autosave context missing or duplicated')
              captured = {}
              for line in trace:
                  match = re.search(r'stage=(early-30ms|settled-350ms) .*?captured=Optional\(\(([-\d.eE]+),\s*([-\d.eE]+)\)\)', line)
                  if match:
                      captured[match[1]] = [float(match[2]), float(match[3])]
                  occlusion = re.search(r'\bocclusion=(\d+)', line)
                  fields = ('appRunning=true', 'appHidden=false', 'appActive=true', 'windowVisible=true', 'key=true', 'exactKey=true', 'contentOwner=true')
                  if not occlusion or not int(occlusion[1]) & 2 or any(field not in line for field in fields):
                      errors.append('native window owner not physically admitted in trace')
              if set(captured) != {'early-30ms', 'settled-350ms'}:
                  errors.append('original actual captured samples absent')
              result = {'attempt': attempt, 'exit': run.returncode, 'primary': primary, 'cleanup': cleanup, 'log_sha256': sha(log), 'outcomes': outcomes, 'selected_started_order': selected_started, 'selected_completed_order': selected_finished, 'validation_errors': errors, 'trace': trace, 'target_error_records': target_errors, 'original_geometry_failure': original_geometry_failure, 'native_revision_receipt_available': False, 'historical_main_context_proved': False, 'captured_samples': captured, 'owner_context': context, 'assertion_records': assertions}
              (evidence / f'attempt-{attempt}.result.json').write_text(json.dumps(result, indent=2) + '\n')
              results.append(result)
              (evidence / 'results.json').write_text(json.dumps(results, indent=2) + '\n')
              print(f'attempt={attempt} primary={primary} cleanup={cleanup} target={outcomes.get(target)} errors={errors}', flush=True)
              if errors:
                  sys.exit('Stop repaired cohort on ANY failed attempt or uncertainty; remaining attempts not run')
          sys.exit(0)
          PYCODE
      - name: Preserve every diagnostic observation
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: sidebar-original19-repaired-evidence
          path: |
            ${{ runner.temp }}/vane-sidebar-cache-geometry/
            !${{ runner.temp }}/vane-sidebar-cache-geometry/runtime-products/**
            !${{ runner.temp }}/vane-sidebar-cache-geometry/runtime-products.tar.gz
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve executed native runtime archive
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: sidebar-original19-repaired-runtime
          path: ${{ runner.temp }}/vane-sidebar-cache-geometry/runtime-products.tar.gz
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
